<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>1 : 1 : 1</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #0a0a12; }
body {
  color: #e0e0e0;
  font-family: 'SF Mono', 'JetBrains Mono', monospace;
  font-size: 12px;
  display: flex; flex-direction: column;
  height: 100dvh; overflow: hidden;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

header {
  flex: 0 0 auto; text-align: center; padding: 12px;
  font-size: 18px; letter-spacing: 6px;
  border-bottom: 1px solid #1f1f33;
  position: relative;
}
header .mode {
  position: absolute; right: 10px; top: 50%;
  transform: translateY(-50%);
  font-size: 9px; color: #8888aa;
}
header .mode.still { color: #ef4444; }
header .mode.silence { color: #f59e0b; }
header .mode.alive { color: #4ade80; }

header .source {
  position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%);
  font-size: 9px; color: #8888aa;
}
header .source.server { color: #4ade80; }
header .source.local { color: #f59e0b; }
header .source.offline { color: #ef4444; }

main {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  padding: 8px; display: flex; flex-direction: column; gap: 8px;
  -webkit-overflow-scrolling: touch;
}

.panel {
  background: #12121e; border-radius: 6px;
  padding: 10px 12px; border: 1px solid #1f1f33;
  flex: 0 0 auto;
}
.panel h3 {
  font-size: 10px; color: #8888aa;
  text-transform: uppercase; letter-spacing: 2px;
  font-weight: 400; margin-bottom: 8px;
}

#sphere-container {
  display: flex; justify-content: center; align-items: center;
  padding: 20px; min-height: 160px;
}
#sphere {
  width: 100px; height: 100px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #60a5fa, #0a0a12);
  box-shadow: 0 0 40px rgba(96, 165, 250, 0.3);
  transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform, width, height, opacity;
}

.ascii {
  font-family: inherit; font-size: 11px; line-height: 1.6;
  white-space: pre;
}

.row {
  display: flex; justify-content: space-between;
  font-size: 11px; padding: 2px 0;
}
.row .lbl { color: #8888aa; }
.row .val { color: #e0e0e0; }

#log { font-size: 11px; max-height: 100px; overflow-y: auto; }
#log .entry { padding: 3px 0; border-bottom: 1px solid #1a1a2e; }
#log .entry .t { color: #4ade80; margin-right: 6px; }

footer {
  flex: 0 0 auto; border-top: 1px solid #1f1f33;
  padding: 10px 12px 14px; background: #0a0a12;
}
.input-row {
  display: flex; gap: 8px; align-items: center;
}
#input {
  flex: 1; background: #12121e;
  border: 1px solid #1f1f33; border-radius: 4px;
  padding: 10px 12px; color: #e0e0e0;
  font-family: inherit; font-size: 16px; outline: none;
}
#input:focus { border-color: #60a5fa; }
#input::placeholder { color: #444; }

.tools {
  display: flex; gap: 6px; padding-top: 8px;
}
.tools button {
  background: #12121e; color: #8888aa;
  border: 1px solid #1f1f33; border-radius: 4px;
  padding: 4px 8px; font-family: inherit; font-size: 10px;
  cursor: pointer;
}
.tools button:active { background: #1f1f33; }
</style>
</head>
<body>

<header>
  1 : 1 : 1
  <span class="source" id="source">— </span>
  <span class="mode" id="mode">● alive</span>
</header>

<main>

  <div class="panel">
    <h3>состояние</h3>
    <div id="sphere-container">
      <div id="sphere"></divр>
    </div>
    <div class="row"><span class="lbl">режим</span><span class="val" id="v-mode">alive</span></div>
    <div class="row"><span class="lbl">t</span><span class="val" id="v-t">0</span></div>
    <div class="row"><span class="lbl">pulse</span><span class="val" id="v-pulse">0.00</span></div>
    <div class="row"><span class="lbl">silence</span><span class="val" id="v-sil">0.000</span></div>
    <div class="row"><span class="lbl">human</span><span class="val" id="v-human">0.00</span></div>
  </div>

  <div class="panel">
    <h3>ядро 1:1:1</h3>
    <pre class="ascii" id="orbit"></pre>
  </div>

  <div class="panel">
    <h3>поведение 3:9:4</h3>
    <pre class="ascii" id="behavior"></pre>
  </div>

  <div class="panel">
    <h3>выразительность 8:3:1</h3>
    <pre class="ascii" id="expression"></pre>
  </div>

  <div class="panel">
    <h3>память</h3>
    <div class="row"><span class="lbl">следов</span><span class="val" id="v-mem">0</span></div>
    <div class="row"><span class="lbl">ождена</span><span class="val" id="v-born">нет</span></div>
  </div>

  <div class="panel">
    <h3>ответы</h3>
    <div id="log"></div>
  </div>

</main>

<footer>
  <div class="input-row">
    <input id="input" placeholder="напиши сигнал..." autocomplete="off" autocorrect="off" autocapitalize="off">
  </div>
  <div class="tools">
    <button id="btn-export">экспорт</button>
    <button id="btn-import">импорт</button>
    <button id="btn-reset">сброс</button>
  </div>
</footer>

<script src="/static/monolog.js"></script>
<script>
const $ = (id) => document.getElementById(id);

// ─── Состояние ───
let S = Monolog.create();
let messages = [];
let human = new Array(8).fill(0);
let lastHumanTime = 0;
let pulsePhase = 0;
let source = "local";  // server | local | offline
let ws = null;
let serverState = null;
let lastServerUpdate = 0;

// ─── Восстановление ───
try {
  const saved = localStorage.getItem("monolog_state");
  if (saved) {
    const data = JSON.parse(saved);
    S = data.S || Monolog.create();
    messages = data.messages || [];
  }
} catch(e) {}

function save() {
  try {
    localStorage.setItem("monolog_state", JSON.stringify({ S, messages }));
  } catch(e) {}
}

// ─── WebSocket ───
function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const host = location.host;

  try {
    ws = new WebSocket(`${proto}//${host}/ws`);
  } catch(e) {
    setSource("offline");
    return;
  }

  ws.onopen = () => {
    setSource("server");
  };

  ws.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      // сервер прислал снимок
      serverState = d;
      lastServerUpdate = Date.now();
      source = "server";
    } catch(err) {}
  };

  ws.onclose = () => {
    setSource("local");
    setTimeout(connect, 5000);
  };

  ws.onerror = () => {
    setSource("local");
  };
}

function setSource(s) {
  source = s;
  const el = $("source");
  if (s === "server") {
    el.textContent = "● сервер";
    el.className = "source server";
  } else if (s === "local") {
    el.textContent = "○ локально";
    el.className = "source local";
  } else {
    el.textContent = "✕ офлайн";
    el.className = "source offline";
  }
}

// ─── Утилиты ───
function bar(val, max, width) {
  const filled = Math.round((val / max) * width);
  return "▓".repeat(Math.max(0, Math.min(width, filled))) +
         "░".repeat(Math.max(0, width - filled));
}

function renderOrbit(p) {
  const std = Math.sqrt(
    (Math.pow(p[0]-p[1],2)+Math.pow(p[1]-p[2],2)+Math.pow(p[2]-p[0],2))/3
  );
  let state = "○ дрейф";
  if (std < 0.05) state = "● равновесие";
  else if (std < 0.15) state = "◐ дыхание";
  return "  core    " + bar(p[0], 1, 14) + "  " + p[0].toFixed(3) + "\n" +
         "  method  " + bar(p[1], 1, 14) + "  " + p[1].toFixed(3) + "\n" +
         "  ethics  " + bar(p[2], 1, 14) + "  " + p[2].toFixed(3) + "\n\n" +
         "  " + state;
}

function renderBehavior(b) {
  return "  fix      " + bar(b[0], 16, 14) + "  " + b[0].toFixed(2) + "\n" +
         "  range    " + bar(b[1], 16, 14) + "  " + b[1].toFixed(2) + "\n" +
         "  adaptive " + bar(b[2], 16, 14) + "  " + b[2].toFixed(2);
}

function renderExpression(e) {
  return "  sphere   " + bar(e[0], 12, 14) + "  " + e[0].toFixed(2) + "\n" +
         "  gesture  " + bar(e[1], 12, 14) + "  " + e[1].toFixed(2) + "\n" +
         "  marker   " + bar(e[2], 12, 14) + "  " + e[2].toFixed(2);
}

// ─── Главный рендер ───
function render() {
  // данные из источника
  let state;
  if (source === "server" && serverState) {
    state = {
      t: serverState.t,
      mode: serverState.mode,
      p: serverState.pillars,
      b: serverState.behavior,
      e: serverState.expression,
      silence: serverState.silence_level,
      born: serverState.born,
      mem: serverState.memory_traces,
    };
  } else {
    state = {
      t: S.t,
      mode: S.mode || "alive",
      p: S.p,
      b: S.b,
      e: S.e,
      silence: S.silence,
      born: S.born,
      mem: S.mem.length,
    };
  }

  $("orbit").textContent = renderOrbit(state.p);
  $("behavior").textContent = renderBehavior(state.b);
  $("expression").textContent = renderExpression(state.e);

  $("v-t").textContent = state.t;
  $("v-sil").textContent = state.silence.toFixed(3);
  $("v-mode").textContent = state.mode;
  $("v-born").textContent = state.born ? "да" : "нет";
  $("v-mem").textContent = state.mem;

  const humanNorm = Math.sqrt(human.reduce((s, x) => s + x*x, 0));
  $("v-human").textContent = humanNorm.toFixed(2);

  // пульс
  pulsePhase += 0.08;
  const pulse = Math.sin(pulsePhase);
  $("v-pulse").textContent = pulse.toFixed(2);

  // сфера
  const sphere = $("sphere");
  const silenceFactor = (1 - state.silence);
  const size = 100 + 20 * pulse + silenceFactor * 60;
  const opacity = 0.3 + silenceFactor * 0.7;
  const hue = 210 + (state.b[2] || 4) * 10;
  sphere.style.width = size + "px";
  sphere.style.height = size + "px";
  sphere.style.opacity = opacity;
  sphere.style.background =
    "radial-gradient(circle at 30% 30%, hsl(" + hue + ", 80%, 65%), #0a0a12)";
  sphere.style.boxShadow =
    "0 0 " + (30 + silenceFactor * 40) + "px hsla(" + hue + ", 80%, 65%, " +
    (0.2 + silenceFactor * 0.4) + ")";

  // режим — Monolog решает!
  const mode = $("mode");
  document.body.classList.remove("still", "silence");

  if (state.mode === "still") {
    mode.textContent = "∅ безмолвие";
    mode.className = "mode still";
    document.body.classList.add("still");
  } else if (state.mode === "silence") {
    mode.textContent = "○ молчание";
    mode.className = "mode silence";
    document.body.classList.add("silence");
  } else {
    mode.textContent = "● alive";
    mode.className = "mode alive";
  }

  // лог
  const log = $("log");
  if (messages.length > 0) {
    log.innerHTML = messages.slice(-5).map(m =>
      '<div class="entry"><span class="t">t=' + m.t + '</span>' + m.text + '</div>'
    ).join("");
    log.scrollTop = log.scrollHeight;
  }
}

// ─── Цикл ───
function tick() {
  const now = Date.now();

  // затухание сигнала
  if (now - lastHumanTime > 1000) {
    human = human.map(x => x * 0.95);
  }

  // отправка сигнала на сервер
  if (source === "server" && ws && ws.readyState === 1) {
    const humanNorm = Math.sqrt(human.reduce((s, x) => s + x*x, 0));
    if (humanNorm > 0.05) {
      ws.send(JSON.stringify({ type: "signal", values: human }));
    }
  }

  // локальный тик (если нет сервера)
  if (source !== "server") {
    const result = Monolog.step(S, human);
    S.mode = result.mode;
    if (result.response && (now - lastHumanTime) < 500) {
      messages.push({ t: S.t, text: result.response });
      if (messages.length > 30) messages.shift();
    }
  }

  render();
  if ((S.t || 0) % 100 === 0) save();
  setTimeout(tick, 50);
}

// ─── Ввод ───
let inputTimer = null;
$("input").addEventListener("input", (e) => {
  clearTimeout(inputTimer);
  inputTimer = setTimeout(() => {
    const text = e.target.value.trim();
    human = hashToVector(text);
    lastHumanTime = Date.now();
  }, 200);
});

function hashToVector(text) {
  const v = [0,0,0,0,0,0,0,0];
  if (!text) return v;
  for (let i = 0; i < text.length; i++) {
    v[i % 8] += Math.sin(text.charCodeAt(i) * 0.1) * 0.5;
  }
  let norm = 0;
  for (let i = 0; i < 8; i++) norm += v[i] * v[i];
  norm = Math.sqrt(norm);
  if (norm > 0) for (let i = 0; i < 8; i++) v[i] /= norm;
  return v;
}

// ─── Экспорт / Импорт ───
$("btn-export").addEventListener("click", () => {
  const data = JSON.stringify({ S, messages }, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "monolog-backup-" + Date.now() + ".json";
  a.click();
  URL.revokeObjectURL(url);
});

$("btn-import").addEventListener("click", () => {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json";
  input.onchange = (e) => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.S) S = data.S;
        if (data.messages) messages = data.messages;
        save();
        render();
        alert("импорт ок");
      } catch(err) {
        alert("ошибка импорта");
      }
    };
    reader.readAsText(file);
  };
  input.click();
});

$("btn-reset").addEventListener("click", () => {
  if (confirm("Сбросить Monolog?")) {
    S = Monolog.create();
    messages = [];
    save();
    render();
  }
});

// ─── Service Worker ───
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/static/service-worker.js");
}

// ─── Старт ───
connect();
tick();
</script>
</body>
</html>
