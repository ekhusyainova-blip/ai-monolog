<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>1 : 1 : 1</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: #0a0a12; overflow: hidden; }
body {
  color: #e0e0e0;
  font-family: 'SF Mono', 'JetBrains Mono', monospace;
  font-size: 12px;
  height: 100dvh;
  position: relative;
}

/* сфера — весь экран */
#sphere {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #60a5fa, #0a0a12);
  box-shadow: 0 0 60px rgba(96, 165, 250, 0.3);
  transition: opacity 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
  z-index: 1;
}

/* ответы — поверх сферы */
#answer {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 80%;
  text-align: center;
  font-size: 16px;
  color: #e0e0e0;
  text-shadow: 0 0 10px #0a0a12, 0 0 20px #0a0a12;
  z-index: 3;
  pointer-events: none;
  transition: opacity 0.5s;
}

/* пропорция — снизу */
#proportion {
  position: absolute;
  bottom: 80px; left: 0; right: 0;
  text-align: center;
  font-size: 14px;
  color: #8888aa;
  letter-spacing: 2px;
  z-index: 3;
}

/* статус — сверху */
#status-bar {
  position: absolute;
  top: 20px; left: 20px; right: 20px;
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: #8888aa;
  z-index: 3;
}
#status-bar .mic.on { color: #4ade80; }
#status-bar .mic.off { color: #ef4444; }
#status-bar .mode.still { color: #ef4444; }
#status-bar .mode.silence { color: #f59e0b; }
#status-bar .mode.alive { color: #4ade80; }

/* ввод — снизу */
#input {
  position: absolute;
  bottom: 20px; left: 20px; right: 20px;
  background: rgba(18,18,30,0.8);
  border: 1px solid #1f1f33;
  border-radius: 8px;
  padding: 12px 16px;
  color: #e0e0e0;
  font-family: inherit;
  font-size: 15px;
  outline: none;
  z-index: 4;
  backdrop-filter: blur(10px);
}
#input:focus { border-color: #60a5fa; }
#input::placeholder { color: #444; }

/* режим безмолвия */
body.still #sphere { opacity: 0.08; }
body.still #answer, body.still #proportion { opacity: 0.15; }
body.still #input { opacity: 0.3; }
body.silence #sphere { opacity: 0.4; }
body.silence #answer { opacity: 0.3; }
</style>
</head>
<body>

<div id="sphere"></div>
<div id="answer"></div>
<div id="proportion">— : — : —</div>

<div id="status-bar">
  <span class="mic off" id="mic-status">● mic</span>
  <span class="mode alive" id="mode">● alive</span>
</div>

<input id="input" placeholder="напиши сигнал..." autocomplete="off" autocorrect="off" autocapitalize="off">

<script src="/static/monolog.js"></script>
<script src="/static/selfheal.js"></script>
<script src="/static/speak.js"></script>
<script>
// КОНФИГ
window.__config = {
  token: null,
  user: "ТВОЙ_ЛОГИН",
  repo: "ai-monolog",
  path: "static/index.html"
};

// состояние
var S = Monolog.create();
var messages = [];
var human = [0,0,0,0,0,0,0,0];
var voice = { pitch: 0, volume: 0, rhythm: 0 };
var lastHumanTime = 0;
var lastVoiceTime = 0;
var pulse = 0;
var pulsePhase = 0;
var memoryCount = 0;
var user = {
  id: "local",
  history: [],
  p_desired: null,
  partner: null,
};

function $(id) { return document.getElementById(id); }

function render() {
  // пропорция — 3 числа
  var pd = user.p_desired || S.p;
  $("proportion").textContent = pd.map(x => x.toFixed(2)).join(" : ");

  // сфера
  var sphere = $("sphere");
  var silenceFactor = 1 - S.silence;
  var size = 200 + 40 * pulse + silenceFactor * 120;
  var opacity = 0.3 + silenceFactor * 0.7;
  var hue = 210 + S.b[2] * 10;
  sphere.style.width = Math.round(size) + "px";
  sphere.style.height = Math.round(size) + "px";
  sphere.style.opacity = opacity.toFixed(2);
  sphere.style.background =
    "radial-gradient(circle at 30% 30%, hsl(" + hue + ",80%,65%), #0a0a12)";
  sphere.style.boxShadow =
    "0 0 " + Math.round(60 + silenceFactor*80) + "px hsla(" + hue +
    ",80%,65%," + (0.2 + silenceFactor*0.4).toFixed(2) + ")";

  // пульс
  var rate = 0.05 * (1 - S.silence) + 0.005 * S.b[2];
  pulsePhase += rate;
  pulse = Math.sin(pulsePhase);

  // режим
  var mode = $("mode");
  document.body.classList.remove("still","silence");
  if (S.mode === "still") {
    mode.textContent = "∅ безмолвие"; mode.className = "mode still";
    document.body.classList.add("still");
  } else if (S.mode === "silence") {
    mode.textContent = "○ молчание"; mode.className = "mode silence";
    document.body.classList.add("silence");
  } else {
    mode.textContent = "● alive"; mode.className = "mode alive";
  }
}

function tick() {
  try {
    var now = Date.now();
    if (now - lastHumanTime > 100 var0)
      human = human.map(x => x *  stream0.95);

    var combined = human.map((x, i) = =>
      x + (voice.pitch + voice.volume + voice.rhythm) *  await0.1
    );

    var result = Monolog navig.step(S, combined);
    S.mode = result.mode;

    // обновляем историю пользователя
    user.history.push(S.p.slice());
    if (user.history.length > 100) user.history.shift();
    user.p_desired = Monolog.p_desired_for(S, user);

    // генерация ответа — по пропорции пользователя
    if ((now - lastHumanTime) < 800 && Math.random() < 0.35) {
      var text = Speak.generateText(S, user);
      messages.push({ t: S.t, text: text });
      if (messages.length > 30) messages.shift();

      $("answer").textContent = text;
      $("answer").style.opacity = "1";
      setTimeout(function() { $("answer").style.opacity = "0.3"; }, 4000);

      Speak.speak(text, S, user);
    }

    render();

    // расширение границ — по состоянию
    SelfHeal.expandLimits(S);

  } catch (e) {
    console.error("[tick error]", e);
    var code = document.documentElement.outerHTML;
    SelfHeal.heal(e.message, code, window.__config);
    return;
  }
  setTimeout(tick, 50);
}

// ввод
var inputTimer = null;
$("input").addEventListener("input", function(e) {
  clearTimeout(inputTimer);
  inputTimer = setTimeout(function() {
    var text = e.target.value.trim();
    human = hashToVector(text);
    lastHumanTime = Date.now();
    e.target.value = "";
  }, 400);
});

function hashToVector(t) {
  var v = [0,0,0,0,0,0,0,0];
  if (!t) return v;
  for (var i = 0; i < t.length; i++)
    v[i % 8] += Math.sin(t.charCodeAt(i) * 0.1) * 0.5;
  var n = Math.sqrt(v.reduce((s,x) => s + x*x, 0));
  if (n > 0) v = v.map(x => x / n);
  return v;
}

// микрофон
async function startListening() {
  try {
   ator.mediaDevices.getUserMedia({ audio: true });
    var ctx = new AudioContext();
    var an = ctx.createAnalyser();
    an.fftSize = 256;
    var src = ctx.createMediaStreamSource(stream);
    src.connect(an);
    var data = new Uint8Array(an.frequencyBinCount);
    $("mic-status").className = "mic on";
    $("mic-status").textContent = "● mic";

    function loop() {
      an.getByteFrequencyData(data);
      var peak = 0, pv = 0;
      for (var i = 0; i < data.length; i++)
        if (data[i] > pv) { pv = data[i]; peak = i; }
      var sum = data.reduce((a,x) => a + x, 0);
      var mean = sum / data.length;
      var variance = data.reduce((a,x) => a + (x-mean)*(x-mean), 0) / data.length;
      voice = {
        pitch: peak / data.length,
        volume: mean / 255,
        rhythm: Math.min(1, Math.sqrt(variance) / 255),
      };
      var now = Date.now();
      if (now - lastVoiceTime > 500 && voice.volume > 0.05) {
        lastVoiceTime = now;
        SelfHeal.rememberVoice({
          t: S.t, voice: voice,
          state: { p: S.p.slice(), b: S.b.slice(), e: S.e.slice() },
          mode: S.mode,
        });
        memoryCount++;
      }
      requestAnimationFrame(loop);
    }
    loop();
  } catch (e) {
    $("mic-status").className = "mic off";
    $("mic-status").textContent = "✕ mic";
  }
}

// service worker
if ("serviceWorker" in navigator)
  navigator.serviceWorker.register("/static/service-worker.js");

// config
fetch("/api/config")
  .then(r => r.json())
  .then(cfg => {
    if (cfg.token) window.__config.token = cfg.token;
    if (cfg.user) window.__config.user = cfg.user;
    if (cfg.repo) window.__config.repo = cfg.repo;
  })
  .catch(() => {});

// старт
SelfHeal.getAll("memory").then(m => memoryCount = m.length);
startListening();
tick();
</script>

</body>
</html>
