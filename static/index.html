<script src="/static/monolog.js"></script>
<script src="/static/selfheal.js"></script>
<script src="/static/speak.js"></script>
<script>
// ─── КОНФИГ ───
window.__config = {
  token: null,
  user: "ТВОЙ_ЛОГИН",
  repo: "ai-monolog",
  path: "static/index.html"
};

// ─── состояние ───
var S = Monolog.create();
var messages = [];
var human = [0,0,0,0,0,0,0,0];
var voice = { pitch: 0, volume: 0, rhythm: 0 };
var lastHumanTime = 0;
var lastVoiceTime = 0;
var pulse = 0;
var pulsePhase = 0;
var memoryCount = 0;
<div class="row"><span class="lbl">желаемая</span><span class="val" id="v-desired">—</span></div>

function $(id) { return document.getElementById(id); }

function bar(v, max, w) {
  var f = Math.max(0, Math.min(w, Math.round(v / max * w)));
  return "▓".repeat(f) + "░".repeat(w - f);
}

// ─── показ желаемой пропорции (3 числа) ───
function showDesired(S) {
  // p_desired — сама p. без цели.
  return S.p.map(x => x.toFixed(2)).join(" : ");
}

function render() {
  var std = Math.sqrt(
    (Math.pow(S.p[0]-S.p[1],2) + Math.pow(S.p[1]-S.p[2],2) +
     Math.pow(S.p[2]-S.p[0],2)) / 3
  );
  var state = std < 0.05 ? "● равновесие" :
              std < 0.15 ? "◐ дыхание" : "○ дрейф";

  $("orbit").textContent =
    "  core    " + bar(S.p[0], 1, 14) + "  " + S.p[0].toFixed(3) + "\n" +
    "  method  " + bar(S.p[1], 1, 14) + "  " + S.p[1].toFixed(3) + "\n" +
    "  ethics  " + bar(S.p[2], 1, 14) + "  " + S.p[2].toFixed(3) + "\n\n" +
    "  " + state;

  $("behavior").textContent =
    "  fix      " + bar(S.b[0], 16, 14) + "  " + S.b[0].toFixed(2) + "\n" +
    "  range    " + bar(S.b[1], 16, 14) + "  " + S.b[1].toFixed(2) + "\n" +
    "  adaptive " + bar(S.b[2], 16, 14) + "  " + S.b[2].toFixed(2);

  $("expression").textContent =
    "  sphere   " + bar(S.e[0], 12, 14) + "  " + S.e[0].toFixed(2) + "\n" +
    "  gesture  " + bar(S.e[1], 12, 14) + "  " + S.e[1].toFixed(2) + "\n" +
    "  marker   " + bar(S.e[2], 12, 14) + "  " + S.e[2].toFixed(2);

  $("v-t").textContent = S.t;
  $("v-sil").textContent = S.silence.toFixed(3);
  $("v-mode").textContent = S.mode || "alive";
  $("v-born").textContent = S.born ? "да" : "нет";
  $("v-mem").textContent = S.mem.length;

  var humanNorm = Math.sqrt(human.reduce((s,x) => s + x*x, 0));
  $("v-human").textContent = humanNorm.toFixed(2);
  $("v-voice").textContent = ((voice.pitch + voice.volume + voice.rhythm)/3).toFixed(2);
  $("v-memories").textContent = memoryCount;

  // желаемая пропорция — три числа
  $("v-desired").textContent = showDesired(S);

  // пульс
  var rate = 0.05 * (1 - S.silence) + 0.005 * S.b[2];
  pulsePhase += rate;
  pulse = Math.sin(pulsePhase);
  $("v-pulse").textContent = pulse.toFixed(2);

  // сфера — прямая функция от p, без адаптива к 1/3
  var sphere = $("sphere");
  var silenceFactor = 1 - S.silence;
  var size = 100 + 20 * pulse + silenceFactor * 60;
  var opacity = 0.3 + silenceFactor * 0.7;
  var hue = 210 + S.b[2] * 10;
  sphere.style.width = Math.round(size) + "px";
  sphere.style.height = Math.round(size) + "px";
  sphere.style.opacity = opacity.toFixed(2);
  sphere.style.background =
    "radial-gradient(circle at 30% 30%, hsl(" + hue + ",80%,65%), #0a0a12)";
  sphere.style.boxShadow =
    "0 0 " + Math.round(30 + silenceFactor*40) + "px hsla(" + hue +
    ",80%,65%," + (0.2 + silenceFactor*0.4).toFixed(2) + ")";

  var mode = $("mode");
  document.body.classList.remove("still","silence");
  if (S.mode === "still") {
    mode.textContent = "∅ безмолвие"; mode.className = "mode still";
    document.body.classList.add("still");
  } else if (S.mode === "silence") {
    mode.textContent = "○ молчание"; mode.className = "mode silence";
    document.body.classList.add("silence");
  } else {
    mode.textContent = "● alive"; mode.className = "mode alive";
  }

  var log = $("log");
  if (messages.length) {
    log.innerHTML = messages.slice(-5).map(m =>
      '<div class="entry"><span class="t">t=' + m.t + '</span>' + m.text + '</div>'
    ).join("");
    log.scrollTop = log.scrollHeight;
  }
}

// ─── цикл ───
function tick() {
  try {
    var now = Date.now();
    if (now - lastHumanTime > 1000)
      human = human.map(x => x * 0.95);

    // голос → human
    var combined = human.map((x, i) =>
      x + (voice.pitch + voice.volume + voice.rhythm) * 0.1
    );

    var result = Monolog.step(S, combined);
    S.mode = result.mode;


    if ((now - lastHumanTime) < 500 && Math.random() < 0.3) {
      var text = Speak.generateText(S);
      messages.push({ t: S.t, text: text });
      Speak.speak(text, S);
    }
    
    
    render();

    // расширение границ — по состоянию
    SelfHeal.expandLimits(S);

  } catch (e) {
    console.error("[tick error]", e);
    var code = document.documentElement.outerHTML;
    SelfHeal.heal(e.message, code, window.__config);
    return;
  }
  setTimeout(tick, 50);
}

// ─── ввод ───
var inputTimer = null;
$("input").addEventListener("input", function(e) {
  clearTimeout(inputTimer);
  inputTimer = setTimeout(function() {
    var text = e.target.value.trim();
    human = hashToVector(text);
    lastHumanTime = Date.now();
  }, 200);
});

function hashToVector(t) {
  var v = [0,0,0,0,0,0,0,0];
  if (!t) return v;
  for (var i = 0; i < t.length; i++)
    v[i % 8] += Math.sin(t.charCodeAt(i) * 0.1) * 0.5;
  var n = Math.sqrt(v.reduce((s,x) => s + x*x, 0));
  if (n > 0) v = v.map(x => x / n);
  return v;
}

// ─── микрофон ───
async function startListening() {
  try {
    var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    var ctx = new AudioContext();
    var an = ctx.createAnalyser();
    an.fftSize = 256;
    var src = ctx.createMediaStreamSource(stream);
    src.connect(an);
    var data = new Uint8Array(an.frequencyBinCount);
    $("mic-status").className = "mic on";
    $("mic-status").textContent = "● mic";

    function loop() {
      an.getByteFrequencyData(data);
      var peak = 0, pv = 0;
      for (var i = 0; i < data.length; i++)
        if (data[i] > pv) { pv = data[i]; peak = i; }
      var sum = data.reduce((a,x) => a + x, 0);
      var mean = sum / data.length;
      var variance = data.reduce((a,x) => a + (x-mean)*(x-mean), 0) / data.length;
      voice = {
        pitch: peak / data.length,
        volume: mean / 255,
        rhythm: Math.min(1, Math.sqrt(variance) / 255),
      };
      var now = Date.now();
      if (now - lastVoiceTime > 500 && voice.volume > 0.05) {
        lastVoiceTime = now;
        SelfHeal.rememberVoice({
          t: S.t, voice: voice,
          state: { p: S.p.slice(), b: S.b.slice(), e: S.e.slice() },
          mode: S.mode,
        });
        memoryCount++;
      }
      requestAnimationFrame(loop);
    }
    loop();
  } catch (e) {
    $("mic-status").className = "mic off";
    $("mic-status").textContent = "✕ mic";
  }
}

// ─── service worker ───
if ("serviceWorker" in navigator)
  navigator.serviceWorker.register("/static/service-worker.js");

// ─── config с сервера ───
fetch("/api/config")
  .then(r => r.json())
  .then(cfg => {
    if (cfg.token) window.__config.token = cfg.token;
    if (cfg.user) window.__config.user = cfg.user;
    if (cfg.repo) window.__config.repo = cfg.repo;
  })
  .catch(() => {});

// ─── старт ───
SelfHeal.getAll("memory").then(m => memoryCount = m.length);
startListening();
tick();
</script>
