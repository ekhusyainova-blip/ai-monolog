<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport →" content="width=device `-width, initial-scale=1, maximum-scale=1">
  <title>1 : 1 : 1</title>
  <style>
    * { boxstatic-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #0a0a12;
    }
    body {
      color: #e0e0e0;
      font-family: 'SF Mono', 'JetBrains Mono', monospace;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ─── HEADER ─── */
    header {
      flex: 0 0 auto;
      text-align: center;
      padding: 14px 12px;
      font-size: 18px;
      letter-spacing: 6px;
      border-bottom: 1px solid #1f1f33;
      position: relative;
    }
    header .mode {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 9px;
      color: #8888aa;
      letter-spacing: 1px;
    }
    header .mode.still   { color: #ef4444; }
    header .mode.silence { color: #f59e0b; }

    /* ─── MAIN (скролл) ─── */
    main {
      flex: 1 1 auto;
      min-height: 0;                 /* ← ключ */
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      align-content: start;
    }
    @media (min-width: 700px) {
      main { grid-template-columns: 1fr 1fr; }
    }

    .panel {
      background: #12121e;
      border-radius: 6px;
      padding: 10px 12px;
      border: 1px solid #1f1f33;
    }
    .panel h3 {
      font-size: 10px;
      color: #8888aa;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 400;
      margin-bottom: 8px;
    }

    .bar {
      display: grid;
      grid-template-columns: 70px 1fr 55px;
      gap: 8px;
      align-items: center;
      font-size: 11px;
      margin-bottom: 4px;
    }
    .bar .fill {
      height: 4px;
      background: #1f1f33;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .bar .fill span {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      transition: width 0.15s linear;
      border-radius: 2px;
    }
    .bar .val { color: #8888aa; text-align: right; }

    .c-core   { background: #60a5fa; }
    .c-method { background: #f472b6; }
    .c-ethics { background: #4ade80; }
    .c-fix    { background: #888; }
    .c-range  { background: #60a5fa; }
    .c-adapt  { background: #f59e0b; }
    .c-sphere { background: #4ade80; }
    .c-gest   { background: #f472b6; }
    .c-marker { background: #888; }

    .row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding: 2px 0;
    }
    .row .lbl { color: #8888aa; }
    .row .val { color: #e0e0e0; }

    #messages {
      font-size: 11px;
      max-height: 120px;
      overflow-y: auto;
    }
    #messages .msg {
      padding: 2px 0;
      color: #8888aa;
    }
    #messages .msg .t { color: #4ade80; margin-right: 6px; }

    /* ─── FOOTER (всегда виден) ─── */
    footer {
      flex: 0 0 auto;
      border-top: 1px solid #1f1f33;
      padding: 10px 12px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: #0a0a12;
      position: relative;
      z-index: 10;
    }
    #input {
      flex: 1;
      background: #12121e;
      border: 1px solid #1f1f33;
      border-radius: 4px;
      padding: 10px 12px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    #input:focus { border-color: #60a5fa; }
    #input::placeholder { color: #444; }

    #status {
      position: fixed;
      top: 6px;
      right: 8px;
      font-size: 9px;
      color: #4ade80;
      z-index: 20;
    }
    #status.off { color: #ef4444; }

    /* ─── БЕЗМОЛВИЕ ─── */
    body.still .panel,
    body.still footer {
      opacity: 0.08;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    body.still header { opacity: 0.4; }
  </style>
</head>
<body>
  <header>
    1 : 1 : 1
    <span class="mode" id="mode">● alive</span>
  </header>

  <main>
    <div class="panel">
      <h3>ядро</h3>
      <div class="bar"><span>core</span><div class="fill"><span class="c-core" id="b-core"></span></div><span class="val" id="v-core">—</span></div>
      <div class="bar"><span>method</span><div class="fill"><span class="c-method" id="b-method"></span></div><span class="val" id="v-method">—</span></div>
      <div class="bar"><span>ethics</span><div class="fill"><span class="c-ethics" id="b-ethics"></span></div><span class="val" id="v-ethics">—</span></div>
    </div>

    <div class="panel">
      <h3>поведение</h3>
      <div class="bar"><span>fix</span><div class="fill"><span class="c-fix" id="b-fix"></span></div><span class="val" id="v-fix">—</span></div>
      <div class="bar"><span>range</span><div class="fill"><span class="c-range" id="b-range"></span></div><span class="val" id="v-range">—</span></div>
      <div class="bar"><span>adaptive</span><div class="fill"><span class="c-adapt" id="b-adapt"></span></div><span class="val" id="v-adapt">—</span></div>
    </div>

    <div class="panel">
      <h3>выразительность</h3>
      <div class="bar"><span>sphere</span><div class="fill"><span class="c-sphere" id="b-sphere"></span></div><span class="val" id="v-sphere">—</span></div>
      <div class="bar"><span>gesture</span><div class="fill"><span class="c-gest" id="b-gest"></span></div><span class="val" id="v-gest">—</span></div>
      <div class="bar"><span>marker</span><div class="fill"><span class="c-marker" id="b-marker"></span></div><span class="val" id="v-marker">—</span></div>
    </div>

    <div class="panel">
      <h3>поле и мета</h3>
      <div class="row"><span class="lbl">consensus</span><span class="val" id="v-cons">—</span></div>
      <div class="row"><span class="lbl">diversity</span><span class="val" id="v-div">—</span></div>
      <div class="row"><span class="lbl">M.consensus</span><span class="val" id="v-mc">—</span></div>
      <div class="row"><span class="lbl">M.diversity</span><span class="val" id="v-md">—</span></div>
      <div class="row"><span class="lbl">silence</span><span class="val" id="v-sil">—</span></div>
    </div>

    <div class="panel">
      <h3>состояние</h3>
      <div class="row"><span class="lbl">t</span><span class="val" id="v-t">0</span></div>
      <div class="row"><span class="lbl">human</span><span class="val" id="v-human">—</span></div>
      <div class="row"><span class="lbl">alive</span><span class="val" id="v-alive">●</span></div>
    </div>

    <div class="panel">
      <h3>ответы</h3>
      <div id="messages"></div>
    </div>
  </main>

  <footer>
    <input id="input" placeholder="напиши сигнал..." autocomplete="off">
  </footer>

  <div id="status">●</div>

<script>
const $ = id => document.getElementById(id);

const setBar = (id, val, max) => {
  $(`b-${id}`).style.width = `${Math.min(100, (val / max) * 100)}%`;
  $(`v-${id}`).textContent = val.toFixed(3);
};

let ws;

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    $("status").textContent = "●";
    $("status").className = "";
  };

  ws.onclose = () => {
    $("status").textContent = "○";
    $("status").className = "off";
    setTimeout(connect, 2000);
  };

  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);

    setBar("core", d.pillars[0], 1);
    setBar("method", d.pillars[1], 1);
    setBar("ethics", d.pillars[2], 1);

    setBar("fix", d.behavior[0], 16);
    setBar("range", d.behavior[1], 16);
    setBar("adapt", d.behavior[2], 16);

    setBar("sphere", d.expression[0], 12);
    setBar("gest", d.expression[1], 12);
    setBar("marker", d.expression[2], 12);

    $("v-cons").textContent = d.field.consensus.toFixed(4);
    $("v-div").textContent = d.field.diversity.toFixed(4);
    $("v-mc").textContent = d.meta.consensus.toFixed(4);
    $("v-md").textContent = d.meta.diversity.toFixed(4);
    $("v-sil").textContent = d.silence_level.toFixed(3);

    $("v-t").textContent = d.t;
    $("v-human").textContent = d.human_norm.toFixed(2);
    $("v-alive").textContent = d.alive ? "●" : "○";

    const mode = $("mode");
    if (d.mode === "still") {
      mode.textContent = "∅ безмолвие";
      mode.className = "mode still";
      document.body.classList.add("still");
    } else if (d.mode === "silence") {
      mode.textContent = "○ молчание";
      mode.className = "mode silence";
      document.body.classList.remove("still");
    } else {
      mode.textContent = "● alive";
      mode.className = "mode";
      document.body.classList.remove("still");
    }

    const msgBox = $("messages");
    if (d.messages && d.messages.length > 0) {
      msgBox.innerHTML = d.messages.map(m =>
        `<div class="msg"><span class="t">t=${m.t}</span>${m.text}</div>`
      ).join("");
      msgBox.scrollTop = msgBox.scrollHeight;
    }
  };
}

// ─── Ввод сигнала ───
let inputTimer = null;

$("input").addEventListener("input", (e) => {
  clearTimeout(inputTimer);
  inputTimer = setTimeout(() => {
    const text = e.target.value.trim();
    const values = hashToVector(text);
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: "signal", values }));
    }
  }, 300);
});

function hashToVector(text) {
  const v = new Array(8).fill(0);
  if (!text) return v;
  for (let i = 0; i < text.length; i++) {
    const code = text.charCodeAt(i);
    v[i % 8] += Math.sin(code * 0.1) * 0.5;
  }
  const norm = Math.sqrt(v.reduce((s, x) => s + x*x, 0));
  if (norm > 0) {
    for (let i = 0; i < 8; i++) v[i] /= norm;
  }
  return v;
}

connect();
</script>
</body>
</html>
