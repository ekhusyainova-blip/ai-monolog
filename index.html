.p{display:none;padding:10px}.p.on{display:block}
.h{border:1px solid var(--ln);padding:8px 12px;margin-bottom:10px}

input:focus,textarea:focus{border-color:var(--tl)}
button.act{background:none;border:1px solid var(--dm);color:var(--ac);font:inherit;padding:4px 8px;cursor:pointer;font-size:10px;margin-right:3px;margin-bottom:3px}
button.act:hover{border-color:var(--tl);color:var(--tl)}
button.act.on{border-color:var(--tl);color:var(--tl);box-shadow:0 0 6px rgba(77,208,199,.4)}
button.act.danger{border-color:var(--rd);color:var(--rd)}
button.act.primary{border-color:var(--pp);color:var(--pp)}

.bar span{position:absolute;left:0;top:0;bottom:0;background:var(--tl);transition:.3s}
.prog{height:6px;background:#1a1518;margin-top:4px;position:relative}
.prog span{position:absolute;left:0;top:0;bottom:0;background:var(--pp);transition:.3s;width:0%}

#home-grid{display:grid;grid-template-columns:1fr;gap:8px}

/* ============================================================
   M.MODE · ЛОКАЛЬНЫЙ РЕЖИМ
   local  — всё в localStorage, GitHub не трогаем
   hybrid — local + pull по кнопке
   remote — pull при старте
   ============================================================ */
def("mode",(()=>{
  const K="monomod.mode";
  const load=()=>{try{return localStorage.getItem(K)||"local"}catch(e){return"local"}};
  const save=m=>{try{localStorage.setItem(K,m)}catch(e){}};
  let current=load();
  const log=[];
  const set=m=>{
    current=m;save(m);
    log.push({t:Date.now(),mode:m});
    S.emit("mode:change",{mode:m});
    if(m==="remote"&&S.get("git")) {
      S.get("git").pull().then(r=>{
        S.emit("mode:pulled",{size:r.content.length});
      }).catch(e=>S.emit("mode:error",{err:e.message}));
    }
    return current;
  };
  const isLocal=()=>current==="local";
  const isHybrid=()=>current==="hybrid";
  const isRemote=()=>current==="remote";
  return{mode:()=>current,set,isLocal,isHybrid,isRemote,
    log:()=>log.slice(-10),
    snap:()=>({form:"MODE",current,localStorage:!!window.localStorage,
      origin:location.origin,hash:location.hash||""})};
})());

/* ============================================================
   M.GIT · GitHub API + локальный режим
   ============================================================ */
def("git",(()=>{
  const K="monomod.github";
  const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}};
  const save=c=>{try{localStorage.setItem(K,JSON.stringify(c))}catch(e){}};
  const cfg=Object.assign({
    owner:"",repo:"",path:"index.html",token:"",branch:"main",hook:"",
    commit_msg:"MONOMOD update"
  },load());

  const log=[];let lastStatus="idle",lastAt=null,progress=0;
  const setCfg=(k,v)=>{cfg[k]=v;save(cfg);return cfg};
  const cfgSnap=()=>({...cfg,token:cfg.token?"•".repeat(6)+cfg.token.slice(-4):""});

  const setProgress=(v)=>{progress=clip(v,0,1);S.emit("git:progress",{progress})};

  /* --- pull --- */
  async function pull(path){
    if(!cfg.owner||!cfg.repo) throw new Error("owner/repo не заданы");
    setProgress(0.1);
    const p=path||cfg.path;
    const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${p}?ref=${cfg.branch}`;
    const h={Accept:"application/vnd.github+json"};
    if(cfg.token) h.Authorization="Bearer "+cfg.token;
    const r=await fetch(url,{headers:h});
    setProgress(0.5);
    if(!r.ok) throw new Error("pull "+r.status);
    const j=await r.json();
    const content=decodeURIComponent(escape(atob(j.content.replace(/\n/g,""))));
    log.push({op:"pull",path:p,ts:Date.now(),ok:true,size:content.length});
    if(log.length>50)log.shift();
    lastStatus="pulled";lastAt=Date.now();setProgress(1);
    S.emit("git:pull",{path:p,size:content.length});
    return {content, sha:j.sha};
  }

  /* --- push --- */
  async function push(content, path, message){
    if(!cfg.owner||!cfg.repo) throw new Error("owner/repo не заданы");
    if(!cfg.token) throw new Error("токен не задан");
    setProgress(0.1);
    const p=path||cfg.path;
    const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${p}`;

    let sha=null;
    try{
      const r0=await fetch(url+"?ref="+cfg.branch,{headers:{
        Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json"}});
      if(r0.ok) sha=(await r0.json()).sha;
    }catch(e){}
    setProgress(0.4);

    const body={
      message: message||cfg.commit_msg,
      content: btoa(unescape(encodeURIComponent(content))),
      branch: cfg.branch
    };
    if(sha) body.sha=sha;

    const r=await fetch(url,{
      method:"PUT",
      headers:{
        Authorization:"Bearer "+cfg.token,
        Accept:"application/vnd.github+json",
        "Content-Type":"application/json"
      },
      body: JSON.stringify(body)
    });
    setProgress(0.8);
    const j=await r.json();
    if(!r.ok){
      lastStatus="error";setProgress(0);
      S.emit("git:error",{status:r.status,msg:j.message});
      throw new Error("push "+r.status+" · "+(j.message||""));
    }

    log.push({op:"push",path:p,ts:Date.now(),ok:true,sha:j.content&&j.content.sha,size:content.length});
    if(log.length>50)log.shift();
    lastStatus="pushed";lastAt=Date.now();setProgress(1);
    S.emit("git:push",{path:p,sha:j.content&&j.content.sha,size:content.length});
    return j;
  }

  /* --- snapshot текущей страницы --- */
  function snapshot(){
    /* Убираем временные пометки .on у вкладок, чтобы в репо попал чистый файл */
    const clone=document.documentElement.cloneNode(true);
    clone.querySelectorAll(".p").forEach(p=>p.classList.remove("on"));
    clone.querySelectorAll("#tabs button").forEach(b=>b.classList.remove("on"));
    const first=clone.querySelector(".p"); if(first) first.classList.add("on");
    const firstBtn=clone.querySelector("#tabs button"); if(firstBtn) firstBtn.classList.add("on");
    return "<!DOCTYPE html>\n"+clone.outerHTML;
  }
  const pushSelf=(msg)=>push(snapshot(),cfg.path,msg||cfg.commit_msg);

  /* --- deploy hook --- */
  async function deploy(){
    if(!cfg.hook) throw new Error("Deploy Hook URL не задан");
    setProgress(0.3);
    const r=await fetch(cfg.hook,{method:"POST"});
    log.push({op:"deploy",ts:Date.now(),ok:r.ok,status:r.status});
    if(log.length>50)log.shift();
    lastStatus=r.ok?"deploying":"error";lastAt=Date.now();setProgress(1);
    S.emit("git:deploy",{ok:r.ok,status:r.status});
    return r.ok;
  }

  /* --- ship: push + deploy --- */
  async function ship(message){
    const p=await pushSelf(message||"MONOMOD ship "+new Date().toISOString());
    let d=null;
    if(cfg.hook){ try{ d=await deploy() }catch(e){} }
    return {pushed:true,deployed:d,sha:p.content&&p.content.sha};
  }

  /* --- ping --- */
  async function ping(){
    try{
      const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}`,{
        headers: cfg.token ? {Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json"} : {}
      });
      if(!r.ok) return {ok:false,status:r.status};
      const j=await r.json();
      lastStatus="ok";lastAt=Date.now();
      return {ok:true,repo:j.full_name,private:j.private,default_branch:j.default_branch};
    }catch(e){ return {ok:false,error:e.message} }
  }

  return {cfg,setCfg,cfgSnap,pull,push,pushSelf,deploy,ship,ping,snapshot,
    log:()=>log.slice().reverse(),
    progress:()=>progress,
    status:()=>({lastStatus,lastAt,ops:log.length,progress}),
    snap:()=>({form:"GIT",owner:cfg.owner||"—",repo:cfg.repo||"—",
      path:cfg.path,branch:cfg.branch,
      token:cfg.token?"••••"+cfg.token.slice(-4):"—",
      hook:cfg.hook?"set":"—",
      status:lastStatus,ops:log.length,progress:+progress.toFixed(2)})};
})());

/* MAP · 3 орбиты */
let mapFilter=null;
function renderMap(el){
  el.innerHTML=hdr("MAP · 3 ОРБИТЫ","[клик группа → фильтр]")+
    `<div class="pn" style="margin-bottom:8px">
       <h2>· ГРУППЫ</h2>
       <button class="act" onclick="mapFilter=null;renderTab('map')">все</button>
       ${Object.keys(G.GROUPS).map(g=>`<button class="act ${mapFilter===g?'on':''}" onclick="mapFilter='${g}';renderTab('map')">${g}</button>`).join("")}
     </div>
     <div class="pn"><canvas id="cv-map" width="900" height="700"></canvas></div>`;
  requestAnimationFrame(()=>drawMap());
}
function drawMap(){
  const cv=$("cv-map"); if(!cv) return;
  const x=cv.getContext("2d"), w=cv.width, h=cv.height, cx=w/2, cy=h/2;
  x.fillStyle="#0d0a0c"; x.fillRect(0,0,w,h);
  const R1=Math.min(w,h)*.18, R2=Math.min(w,h)*.30, R3=Math.min(w,h)*.42;
  x.strokeStyle="#221c1f"; x.lineWidth=.5;
  [R1,R2,R3].forEach(r=>{x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke()});
  const gc={core:"#4dd0c7",ahead:"#f59e0b",guide:"#a78bfa",observe:"#ef4444",gen:"#10b981",social:"#e8c39e",git:"#a78bfa",base:"#3a3236"};
  const byGroup={};
  G.nodes.forEach(id=>{const g=G.group(id);if(!byGroup[g])byGroup[g]=[];if(id!=="core")byGroup[g].push(id)});
  const pos={core:{x:cx,y:cy}};
  const order=["git","ahead","guide","observe","gen","social","base"];
  order.forEach((g,gi)=>{
    const arr=byGroup[g]||[]; if(!arr.length) return;
    const r=[R1,R1,R1,R2,R2,R3,R3][gi]||R3;
    arr.forEach((id,i)=>{const a=(i/arr.length)*Math.PI*2-Math.PI/2+gi*.3;
      pos[id]={x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r}});
  });
  const visible=id=>!mapFilter||G.group(id)===mapFilter||id==="core";
  G.edges.forEach(([a,b,w])=>{
    if(!visible(a)||!visible(b)) return;
    const A=pos[a],B=pos[b]; if(!A||!B) return;
    const ag=G.group(a),bg=G.group(b);
    const col=(a==="core"||b==="core")?"rgba(77,208,199,"+Math.min(.7,w*.35)+")":
      (ag===bg)?`${gc[ag]||"#3a3236"}55`:"rgba(58,50,54,.5)";
    x.strokeStyle=col;x.lineWidth=Math.min(1.5,w*.25);
    x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.stroke();
  });
  G.nodes.forEach(id=>{
    if(!visible(id)) return;
    const p=pos[id],g=G.group(id),ic=id==="core";
    const deg=G.degree(id);const r=ic?20:Math.max(3,Math.min(9,3+deg*.5));
    const col=gc[g]||"#3a3236";
    x.fillStyle="#0d0a0c";x.strokeStyle=col;x.lineWidth=ic?2:1.2;
    x.beginPath();x.arc(p.x,p.y,r,0,Math.PI*2);x.fill();x.stroke();
    const key=["core","git","gid","logi","exchange","buffer","match","flow","dispatch","attention","levers","lexicon"].includes(id);
    if(ic||key||deg>=8){x.fillStyle=col;x.font=(ic?"bold 11px":"9px")+" Courier New";
      x.textAlign="center";x.textBaseline="middle";x.fillText(ic?"CORE":id,p.x,p.y+(ic?0:r+9))}
  });
}

function renderSnap(el,t){
  const o=S.get(t);
  if(!o||!o.snap){el.innerHTML=hdr(t.toUpperCase(),"")+`<div class="pn">· нет snapshot</div>`;return}
  const s=o.snap();
  const nb=G.edges.filter(([a,b])=>a===t||b===t).map(([a,b,w])=>({n:a===t?b:a,w})).sort((x,y)=>y.w-x.w);
  el.innerHTML=hdr(t.toUpperCase(),`[${G.group(t)} · deg=${G.degree(t)}]`)+
    `<div class="c2"><div class="pn"><h2>· SNAPSHOT</h2>${Object.entries(s).map(([k,v])=>
      `<div class="r"><span class="k">${k}</span><span>${typeof v==="object"?JSON.stringify(v):v}</span></div>`).join("")}</div>
     <div class="pn"><h2>· СВЯЗИ (${nb.length})</h2>${nb.slice(0,20).map(x=>
      "><span class="k">${x.n}</span><span>${x.w.toFixed(2)}</span></div>`).join("")}</div></div>`;
}
