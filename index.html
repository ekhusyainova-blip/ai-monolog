<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">

<style>
:root{--bg:#0a0809;--ac:#e8c39e;--tl:#4dd0c7;--dm:#3a3236;--ln:#221c1f;--gd:#f59e0b;--rd:#ef4444;--gr:#10b981;--pp:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ac);font:12px/1.4 'Courier New',monospace;overflow:hidden;-webkit-text-size-adjust:100%}
#bar{padding:4px 6px;border-bottom:1px solid var(--ln);background:#0d0a0c}
#bar .t{color:var(--tl);font-size:10px;letter-spacing:2px;display:block;margin-bottom:3px}
#bar .badge{color:var(--dm);font-size:9px;display:block;margin-bottom:4px}
#bar .badge b{color:var(--tl);font-weight:400}
#tabs{display:flex;flex-wrap:wrap;gap:2px;max-height:76px;overflow-y:auto}
#tabs button{background:none;border:1px solid var(--dm);color:var(--ac);font:9px 'Courier New',monospace;padding:3px 5px;cursor:pointer;letter-spacing:.5px;white-space:nowrap}
#tabs button:hover,#tabs button.on{border-color:var(--tl);color:var(--tl)}
#tabs button.home-btn{border-color:var(--gd);color:var(--gd)}
#stg{position:absolute;top:104px;left:0;right:0;bottom:0;overflow:auto;-webkit-overflow-scrolling:touch}
.p{display:none;padding:10px}.p.on{display:block}
.h{border:1px solid var(--ln);padding:8px 12px;margin-bottom:10px}
.h h1{font-size:12px;font-weight:400;letter-spacing:1.5px;margin-bottom:3px}
.h .f{color:var(--tl);font-size:10px}
.pn{border:1px solid var(--ln);padding:10px;background:#0d0a0c;margin-bottom:8px}
.pn h2{font-size:10px;color:var(--tl);font-weight:400;letter-spacing:1px;margin-bottom:6px}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.c3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.r{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--ln);font-size:10px;align-items:center;gap:6px}
.r:last-child{border-bottom:none}.r .ok{color:var(--tl)}.r .k{color:var(--tl);font-size:9px}
canvas{display:block;background:#0d0a0c;border:1px solid var(--ln);max-width:100%;height:auto}
input,textarea{background:#0d0a0c;border:1px solid var(--dm);color:var(--ac);font:inherit;padding:6px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--tl)}
button.act{background:none;border:1px solid var(--dm);color:var(--ac);font:inherit;padding:4px 8px;cursor:pointer;font-size:10px;margin-right:3px;margin-bottom:3px}
button.act:hover{border-color:var(--tl);color:var(--tl)}
button.act.on{border-color:var(--tl);color:var(--tl);box-shadow:0 0 6px rgba(77,208,199,.4)}
.msg{padding:5px 7px;border-left:2px solid var(--ln);margin-bottom:5px;font-size:10px}
.msg.you{border-color:var(--tl)}.msg.core{border-color:var(--ac)}
.msg .who{color:var(--tl);font-size:9px;letter-spacing:.5px}
.msg .ts{color:var(--dm);font-size:8px;margin-left:5px}
.bar{height:3px;background:#1a1518;margin-top:2px;position:relative;flex:1;margin:0 6px}
.bar span{position:absolute;left:0;top:0;bottom:0;background:var(--tl);transition:.3s}
#wave{position:fixed;top:0;left:0;right:0;height:2px;background:var(--tl);opacity:0;transition:.15s;pointer-events:none;z-index:99}
#home-grid{display:grid;grid-template-columns:1fr;gap:8px}
.home-block{border:1px solid var(--ln);padding:10px;background:#0d0a0c}
.home-block h3{font-size:10px;color:var(--tl);font-weight:400;letter-spacing:1.5px;margin-bottom:6px;text-transform:uppercase}
.tag{display:inline-block;border:1px solid var(--dm);padding:2px 6px;margin:2px;font-size:9px;color:var(--ac)}
.tag.k{color:var(--tl);border-color:var(--tl)}
.tag.w{color:var(--gd);border-color:var(--gd)}
.tag.r{color:var(--rd);border-color:var(--rd)}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:#0a0809}::-webkit-scrollbar-thumb{background:#1f1a22}
::selection{background:var(--tl);color:var(--bg)}
@media(min-width:700px){#home-grid{grid-template-columns:1fr 1fr}}
</style></head><body>

<script>
/* ============================================================
   G · граф (те же 67 узлов, 189 связей) + группы + степени
   ============================================================ */
const G = {
  nodes:["core","map","chat","monolog","cognitive","perception","chatY","klepa",
    "agents","learning","profile","sphere","viz-1d","viz-5d","social-5d","ring",
    "ui","archive","bridge","center","convert",

  edges:[
    ["core","map",1],["core","chat",1],["core","monolog",1],["core","cognitive",1],
    ["core","perception",1],["core","chatY",1],["core","klepa",1],["core","agents",1],
    ["core","learning",1],["map","chat",1],["chat","monolog",1],["cognitive","perception",1],
    ["chatY","klepa",1],["klepa","agents",1],["agents","learning",1],
    ["perception","learning",1],["sphere","monolog",1.2],
    ["core","ui",1.5],["ui","profile",1],["ui","monolog",1],["ui","klepa",1],
    ["core","archive",1.3],["core","bridge",1.3],["core","center",1.3],
    ["archive","bridge",1.5],["archive","center",1.5],["bridge","center",1.5],
    ["ui","archive",1.2],["ui","bridge",1.2],["ui","center",1.2],
    ["core","convert",1.4],["ui","convert",1.3],["convert","archive",1.2],["convert","bridge",1.2],
    ["core","chat_voice",1.2],["chat","chat_voice",1.5],["chat_voice","chat_avatar",1.4],
    ["chat_avatar","social",1.3],["chat","perception",1],["chat_voice","sense",1.1],
    ["social","subs",1.5],["social","persona",1.4],["subs","persona",1.5],["persona","adapt",1.6],
    ["subs","utility",1.3],["social","lots",1.2],
    ["utility","lots",1.5],["lots","templates",1.2],["templates","adapt",1.3],
    ["utility","learning",1.1],["lots","bridge",1],["templates","convert",1.1],
    ["adapt","persona",1.6],["adapt","ui",1.5],["adapt","profile",1.2],["persona","profile",1.2],
    ["adapt","dims",1.3],
    ["game","agents",1.2],["game","learning",1.3],["game","persona",1.3],
    ["game","templates",1.2],["game","world",1.5],["game","immersion",1.4],
    ["travel","dims",1.5],["travel","world",1.5],["travel","sphere",1.2],["dims","sense",1.4],
    ["dims","viz-5d",1.3],["travel","immersion",1.5],
    ["sense","perception",1.5],["sense","cognitive",1.3],["sense","dims",1.4],
    ["sense","immersion",1.5],["sense","adapt",1.2],
    ["video","anim",1.4],["video","movies",1.5],["anim","blog",1.2],["movies","blog",1.3],
    ["video","world",1.2],["anim","world",1.1],["movies","persona",1.2],["blog","persona",1.3],
    ["world","immersion",1.6],["world","travel",1.5],["world","social-5d",1.2],
    ["immersion","travel",1.5],["immersion","sense",1.4],["world","ui",1.3],
    ["social","chat",1.2],["subs","chat",1.1],["blog","social",1.2],
    ["core","gen_text",1.3],["chat_voice","gen_text",1.5],["monolog","gen_text",1.2],["persona","gen_text",1.4],
    ["gen_text","gen_avatar",1.5],["chat_avatar","gen_avatar",1.5],["persona","gen_avatar",1.4],["adapt","gen_avatar",1.2],
    ["gen_text","gen_video_avatar",1.4],["video","gen_video_avatar",1.5],["movies","gen_video_avatar",1.4],["persona","gen_video_avatar",1.4],
    ["social","reputation",1.4],["subs","reputation",1.5],["utility","reputation",1.5],["persona","reputation",1.3],
    ["reputation","priority",1.5],["reputation","focus",1.3],
    ["learning","anticipate",1.5],["sense","anticipate",1.4],["core","anticipate",1.2],["anticipate","calendar",1.5],
    ["anticipate","notifications",1.4],["anticipate","focus_hints",1.4],
    ["calendar","notifications",1.5],["calendar","persona",1.2],
    ["notifications","priority",1.5],["priority","focus",1.5],["focus","focus_hints",1.5],["focus_hints","adapt",1.3],
    ["core","obs_in",1.5],["sphere","obs_in",1.5],["perception","obs_in",1.5],
    ["obs_in","obs_out",1.8],["obs_out","ui",1.5],["obs_out","world",1.4],["obs_out","archive",1.3],
    ["core","wit_in",1.4],["sphere","wit_in",1.4],["perception","wit_in",1.3],["obs_out","wit_in",1.6],
    ["wit_in","wit_out",1.8],["wit_out","ui",1.5],["wit_out","archive",1.4],["wit_out","world",1.4],
    ["core","prt_in",1.4],["ui","prt_in",1.3],["travel","prt_in",1.3],["game","prt_in",1.3],["social","prt_in",1.2],
    ["prt_in","prt_out",1.8],["prt_out","core",1.6],["prt_out","world",1.5],["prt_out","immersion",1.5],["prt_out","social",1.4],
    ["wit_out","fmt_in",1.6],["prt_out","fmt_in",1.6],["gen_text","fmt_in",1.4],["gen_avatar","fmt_in",1.4],
    ["fmt_in","fmt_out",1.8],
    ["fmt_out","video",1.5],["fmt_out","blog",1.4],["fmt_out","movies",1.4],["fmt_out","social",1.3],["fmt_out","chat_voice",1.4],
    ["wit_out","prt_in",1.7],["prt_out","wit_in",1.7],
    ["fmt_out","world",1.5],
    ["core","attention",1.4],["priority","attention",1.5],["focus","attention",1.5],
    ["attention","fmt_out",1.5],["attention","ui",1.4],["attention","sense",1.3],
    ["attention","focus_hints",1.4],
    ["attention","levers",1.5],["sense","levers",1.4],["focus","levers",1.4],
    ["levers","center",1.3],["levers","sense",1.4],["levers","lexicon",1.5],
    ["levers","travel",1.2],
    ["gen_text","lexicon",1.5],["gen_avatar","lexicon",1.4],["monolog","lexicon",1.3],
    ["lexicon","gen_text",1.5],["lexicon","levers",1.5],
    ["attention","gid",1.5],["levers","gid",1.5],["lexicon","gid",1.4],
    ["adapt","gid",1.5],["focus","gid",1.4],["anticipate","gid",1.5],
    ["calendar","gid",1.4],["persona","gid",1.5],["travel","gid",1.4],
    ["world","gid",1.5],["gid","fmt_out",1.5],["gid","prt_out",1.5],
    ["gid","wit_out",1.4],["gid","obs_out",1.4],
    ["gid","logi",1.6],["travel","logi",1.5],["exchange","logi",1.6],
    ["logi","dispatch",1.7],["logi","gid",1.5],["logi","world",1.5],
    ["lots","exchange",1.6],["utility","exchange",1.6],["reputation","exchange",1.5],
    ["exchange","logi",1.6],["exchange","buffer",1.7],["exchange","match",1.5],
    ["exchange","archive",1.3],["buffer","flow",1.6],["buffer","world",1.4],
    ["archive","buffer",1.4],["persona","match",1.5],["subs","match",1.6],["utility","match",1.5],
    ["match","exchange",1.6],["match","notifications",1.4],
    ["anticipate","flow",1.6],["learning","flow",1.5],["obs_out","flow",1.6],
    ["flow","dispatch",1.7],["flow","calendar",1.5],
    ["match","dispatch",1.5],
    ["dispatch","gid",1.7],["dispatch","calendar",1.5],
    ["dispatch","notifications",1.5],["dispatch","attention",1.4]
  ],

  W:{}, DEG:{}, GROUPS:{},
  build(){
    this.edges.forEach(([a,b,w])=>{ this.W[a+"|"+b]=w; this.W[b+"|"+a]=w;
      this.DEG[a]=(this.DEG[a]||0)+1; this.DEG[b]=(this.DEG[b]||0)+1 });
    this.GROUPS={
      core:["core"],
      ahead:["logi","exchange","buffer","match","flow","dispatch"],
      guide:["gid","attention","levers","lexicon","anticipate","calendar","notifications","priority","focus","focus_hints"],
      observe:["obs_in","obs_out","wit_in","wit_out","prt_in","prt_out","fmt_in","fmt_out"],
      gen:["gen_text","gen_avatar","gen_video_avatar","video","anim","movies","blog"],
      social:["social","subs","utility","lots","templates","persona","reputation","chat","chat_voice","chat_avatar"],
      base:["map","monolog","cognitive","perception","chatY","klepa","agents","learning","profile","sphere","viz-1d","viz-5d","social-5d","ring","ui","archive","bridge","center","convert","adapt","game","travel","dims","sense","world","immersion"]
    };
  },
  neighbor(id){ return this.edges.filter(([a,b])=>a===id||b===id).map(([a,b])=>a===id?b:a) },
  weight(a,b){ return this.W[a+"|"+b]||this.W[b+"|"+a]||1 },
  degree(id){ return this.DEG[id]||0 },
  group(id){ for(const g in this.GROUPS) if(this.GROUPS[g].includes(id)) return g; return "base" },
  path(a,b){ if(a===b) return [a];
    const q=[[a]], seen={[a]:1};
    while(q.length){ const p=q.shift(), last=p[p.length-1];
      for(const n of this.neighbor(last)){
        if(seen[n]) continue;
        if(n===b) return [...p,n];
        seen[n]=1; q.push([...p,n]) } }
    return null },
  bfs(src,radius=3){
    const out=[]; const q=[[src,0,1]]; const seen={[src]:1};
    while(q.length){ const [id,d,acc]=q.shift();
      if(d>=radius) continue;
      for(const n of this.neighbor(id)){
        if(seen[n]) continue; seen[n]=1;
        const w=this.weight(id,n);
        out.push({from:id,to:n,hop:d+1,w:+(acc*w).toFixed(3)});
        q.push([n,d+1,acc*w]) } }
    return out }
};
G.build();

/* ============================================================
   S · шина
   ============================================================ */
const S = (()=>{
  const L={}, R={};
  return{
    on(t,f){ (L[t]=L[t]||[]).push(f) },
    emit(t,d){ (L[t]||[]).forEach(f=>{try{f(d)}catch(e){}}) },
    node(id,api){ R[id]=api; S.emit("reg",{id}); return api },
    get:id=>R[id], list:()=>Object.keys(R),
    all(){ const o={}; for(const i in R) try{o[i]=R[i].snap?R[i].snap():null}catch(e){}; return o },
    snap:()=>({form:"core",core:[.36,.31,.33],center:.42,hash:"rqlmhwgt",
      registered:Object.keys(R).length, links:G.edges.length,
      listeners:Object.keys(L).length}),
    route(a,b,ty,payload){
      const p=G.path(a,b); if(!p) return null;
      let acc=1;
      p.slice(1).forEach((id,i)=>{ acc*=G.weight(p[i],id);
        setTimeout(()=>{ S.emit("hop",{i:i+1,from:p[i],to:id,path:p,type:ty,w:+acc.toFixed(3)});
          S.emit(ty,{...payload,via:id,from:p[i],hopWeight:acc}); }, i*90) });
      return p },
    wave(src){
      S.emit("wave",{src,t:Date.now()});
      const w=document.getElementById("wave");
      if(w){ w.style.opacity=.9; setTimeout(()=>w.style.opacity=0,180) }
      const bfs=G.bfs(src,3);
      bfs.forEach(({to,hop,w:acc})=>{ setTimeout(()=>S.emit("wave:hit",{src,node:to,hop,w:acc}),hop*70) }) },
    echo(src,ty,payload){ setTimeout(()=>S.emit("echo",{src,type:ty,payload,t:Date.now()}), 600+Math.random()*300) },
    cascade(src,ty,payload,depth=2){
      S.emit(ty,{...payload,from:src});
      const bfs=G.bfs(src,depth);
      bfs.forEach(({to,hop,w})=>{ if(w<0.4) return;
        setTimeout(()=>S.emit(ty+":cascade",{...payload,from:src,via:to,hop,w}),hop*120) }) }
  };
})();
const clip=(v,a,b)=>Math.max(a,Math.min(b,v));
const norm=(a,t)=>{const s=a.reduce((x,y)=>x+y,0)||1;return a.map(x=>x*t/s)};
const rand=a=>a[Math.floor(Math.random()*a.length)];
const def=(id,o)=>S.node(id,Object.assign({id,snap:()=>({form:id})},o));

/* Ψ · Ω */
const Ψ={p:[0.36,0.31,0.33],rotate(){const [c,m,s]=this.p;
  this.p=norm([c+.05*(s-m),m+.05*(c-s),s+.05*(m-c)].map(x=>clip(x,.05,.95)),1)},
  sum(){return this.p.reduce((a,b)=>a+b,0)},snap(){return{form:"Ψ",p:this.p.slice(),sum:this.sum()}}};
setInterval(()=>Ψ.rotate(),100);
const Ω={value:0.42,locks:[],lock(reason="manual"){const l={t:Date.now(),reason,core:Ψ.p.slice(),center:this.value};
  this.locks.push(l);if(this.locks.length>100)this.locks.shift();S.emit("ctr",{reason,t:l.t});return l},
  snap:()=>({form:"Ω",value:this.value,locks:this.locks.length})};

/* ============================================================
   МИНИМАЛЬНЫЙ НАБОР УЗЛОВ (для работы home/chat/gid/plan)
   ============================================================ */
def("map",{snap:()=>({form:"map",n:G.nodes.length,m:G.edges.length})});
def("chat",(()=>{const h=[];return{
  push:(w,t)=>{h.push({w,t,ts:Date.now()});if(h.length>200)h.shift();S.emit("msg",{w,t,ts:Date.now()})},
  log:()=>h,snap:()=>({form:"chat",msgs:h.length})}})());
def("chat_voice",(()=>{const h=[];return{
  push:(w,t,dur)=>{h.push({w,t,dur,ts:Date.now()});S.emit("voice:out",{w,t,dur})},
  speak:t=>{ if(!("speechSynthesis" in window)){return} const u=new SpeechSynthesisUtterance(t);
    u.lang="ru-RU";u.pitch=.5+(Ψ.p[0]-Ψ.p[2])*.5;u.rate=.7+Ψ.p[1]*.6;speechSynthesis.speak(u) },
  listen:(cb)=>{ try{ const R=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!R) return null; const r=new R(); r.lang="ru-RU"; r.continuous=true; r.interimResults=false;
    r.onresult=e=>{ const t=e.results[e.results.length-1][0].transcript; cb(t) };
    r.start(); return r }catch(e){ return null } },
  log:()=>h,snap:()=>({form:"chat_voice",msgs:h.length})}})());
def("chat_avatar",(()=>{const h=[];const personas=[
  {name:"Исследователь",p:[.4,.3,.3]},{name:"Наблюдатель",p:[.5,.2,.3]},
  {name:"Строитель",p:[.3,.4,.3]},{name:"Творец",p:[.3,.3,.4]}];
  return{personas,log:()=>h,push:(who,text)=>h.push({who,text,ts:Date.now()}),
    snap:()=>({form:"chat_avatar",msgs:h.length})}})());
def("gen_text",(()=>{
  const W={core:["ось","центр","опора","ядро"],method:["шаг","путь","ритм","дело"],ethics:["мы","связь","рядом","вместе"]};
  const V=["держишь","идёшь","дышишь","смотришь","слушаешь"];
  const E=[".","..."," — ","?","!"," "];
  const gen=()=>{const mx=Ψ.p.indexOf(Math.max(...Ψ.p)),mn=Ψ.p.indexOf(Math.min(...Ψ.p));
    const K=["core","method","ethics"];
    return rand(W[K[mx]])+" "+rand(V)+" "+rand(W[K[mn]])+rand(E)};
  const respond=(input)=>{
    const t=input.toLowerCase();
    if(t.includes("привет")||t.includes("здрав")) return "· держу ось";
    if(t.includes("как")||t.includes("что")) return "· "+rand(["вижу","слышу","фиксирую"])+" "+gen();
    if(t.includes("план")||t.includes("день")) return "· план: "+(S.get("home")?S.get("home").plan().slice(0,3).map(x=>x.title).join(", "):"собери в home");
    if(t.includes("лот")||t.includes("купить")) return "· открой lots → buy";
    if(t.includes("связ")) return "· всего "+G.edges.length+" связей, узлов "+G.nodes.length;
    return "· "+gen() };
  const speak=t=>{ if(!("speechSynthesis" in window)) return;
    const u=new SpeechSynthesisUtterance(t);u.lang="ru-RU";u.pitch=.5+(Ψ.p[0]-Ψ.p[2])*.5;u.rate=.7+Ψ.p[1]*.6;speechSynthesis.speak(u) };
  return{gen,respond,speak,snap:()=>({form:"gen_text",pitch:+(.5+(Ψ.p[0]-Ψ.p[2])*.5).toFixed(2)})}})());
def("gen_avatar",(()=>{const P=[
  {name:"Исследователь",p:[.4,.3,.3],v:["паттерн","связь","шум"]},
  {name:"Наблюдатель",p:[.5,.2,.3],v:["фиксирую","вижу"]},
  {name:"Строитель",p:[.3,.4,.3],v:["мост","блок","соединяю"]},
  {name:"Творец",p:[.3,.3,.4],v:["создаю","рисую"]}];
  const gen=who=>{const p=P.find(x=>x.name===who)||P[0];return rand(p.v)+" "+rand(["тихо","ясно","ровно","."])};

def("exchange",(()=>{const deals=[];let vol=0;
  const nonlinear=(u,rep,demand)=>+(10*u*(1+rep/10)*(1+demand/10)).toFixed(2);
  const deal=(from,to,item)=>{const u=S.get("utility").get(item||"core");const r=S.get("reputation").get(from)||5;

  S.on("lots:sold",d=>deal("core",d.to||"persona",d.name));
  S.on("match:found",m=>deal(m.a,m.b,m.item));

  return{deals:()=>deals.slice(-30),deal,nonlinear,snap:()=>({form:"EXCH",deals:deals.length,volume:+vol.toFixed(2)})}})());
def("buffer",(()=>{const store=[];let hits=0,misses=0;
  const put=(id,item,payload)=>{store.push({id,item,payload,t:Date.now()});if(store.length>128)store.shift();return store[store.length-1]};
  const get=item=>{const s=store.find(x=>x.item===item);if(s){hits++;return s}else{misses++;return null}};
  S.on("buffer:store",d=>put(d.id,d.item,d));S.on("logi:arrive",d=>put(d.id,d.item,d));
  return{store:()=>store.slice(-30),put,get,hits:()=>hits,misses:()=>misses,snap:()=>({form:"BUF",stored:store.length,hits,misses,size:128})}})());

/* GID — гид */
def("gid",(()=>{
  const st={route:["core"],target:"core",step:0,params:{rt:.8,st:.7,ad:.6,fx:.7,nt:.8,hm:.9},history:[]};
  const Γ=()=>{const p=st.params;return +((p.rt+p.st+p.ad+p.fx+p.nt+p.hm)/6).toFixed(2)};
  const routeTo=target=>{st.target=target;const p=G.path("core",target)||["core"];st.route=p;st.step=0;
    S.emit("gid:route",{target,path:p});return p};
  const step_=()=>{st.step++;if(st.step>st.route.length-1){st.route=G.path("core",rand(G.nodes))||["core"];st.step=0}
    const next=st.route[st.step]||"core";st.history.push({to:next,ts:Date.now()});
    if(st.history.length>30)st.history.shift();S.emit("gid:step",{to:next,Γ:Γ()});return next};
  setInterval(()=>{if(Math.random()<.3)step_()},3000);
  return{st,routeTo,Γ,step:step_,snap:()=>({form:"GID",target:st.target,step:st.step,Γ:Γ()})}})());

/* MAP · 3 орбиты + размер по степени + подписи */
let mapFilter=null;
function renderMap(el){
  el.innerHTML=hdr("MAP · 3 ОРБИТЫ","[клик по узлу → переход · клик по группе → фильтр]")+
    `<div class="pn" style="margin-bottom:8px">
       <h2>· ГРУППЫ</h2>
       <button class="act" onclick="mapFilter=null;renderMap(document.getElementById('p-map'))">все</button>
       ${Object.keys(G.GROUPS).map(g=>`<button class="act ${mapFilter===g?'on':''}" onclick="mapFilter='${g}';renderMap(document.getElementById('p-map'))">${g}</button>`).join("")}
     </div>
     <div class="pn"><canvas id="cv-map" width="900" height="700"></canvas></div>
     <div class="pn"><h2>· ЛЕГЕНДА</h2>
       <div class="r"><span class="k">core</span><span>центр, 12 связей</span></div>
       <div class="r"><span class="k">ahead</span><span>6 узлов логистики</span></div>
       <div class="r"><span class="k">guide</span><span>гид, внимание, рычаги</span></div>
       <div class="r"><span class="k">observe</span><span>наблюдение 8 узлов</span></div>
       <div class="r"><span class="k">base</span><span>базовые узлы</span></div></div>`;
  requestAnimationFrame(()=>drawMap());
}
function drawMap(){
  const cv=$("cv-map"); if(!cv) return;
  const x=cv.getContext("2d"), w=cv.width, h=cv.height, cx=w/2, cy=h/2;
  x.fillStyle="#0d0a0c"; x.fillRect(0,0,w,h);
  const R1=Math.min(w,h)*.18, R2=Math.min(w,h)*.30, R3=Math.min(w,h)*.42;
  x.strokeStyle="#221c1f"; x.lineWidth=.5;
  [R1,R2,R3].forEach(r=>{x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);x.stroke()});

  const groupCol={core:"#4dd0c7",ahead:"#f59e0b",guide:"#a78bfa",observe:"#ef4444",gen:"#10b981",social:"#e8c39e",base:"#3a3236"};
  const byGroup={};
  G.nodes.forEach(id=>{
    const g=G.group(id);
    if(!byGroup[g]) byGroup[g]=[];
    if(id!=="core") byGroup[g].push(id);
  });
  const pos={core:{x:cx,y:cy}};
  const orbitOrder=["ahead","guide","observe","gen","social","base"];
  orbitOrder.forEach((g,gi)=>{
    const arr=byGroup[g]||[]; if(!arr.length) return;
    const r=[R1,R1,R2,R2,R3,R3][gi]||R3;
    arr.forEach((id,i)=>{
      const a=(i/arr.length)*Math.PI*2 - Math.PI/2 + gi*0.3;
      pos[id]={x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r};
    });
  });

  const visible=id=>!mapFilter || G.group(id)===mapFilter || id==="core";
  G.edges.forEach(([a,b,w])=>{
    if(!visible(a)||!visible(b)) return;
    const A=pos[a], B=pos[b]; if(!A||!B) return;
    const ag=G.group(a), bg=G.group(b);
    const col=(a==="core"||b==="core")?"rgba(77,208,199,"+Math.min(.7,w*.35)+")":
      (ag===bg)?`${groupCol[ag]||"#3a3236"}55`:"rgba(58,50,54,.5)";
    x.strokeStyle=col; x.lineWidth=Math.min(1.5,w*.25);
    x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.stroke();
  });

  G.nodes.forEach(id=>{
    if(!visible(id)) return;
    const p=pos[id]; const g=G.group(id); const ic=id==="core";
    const deg=G.degree(id);
    const r=ic?20:Math.max(3,Math.min(9,3+deg*.5));
    const col=groupCol[g]||"#3a3236";
    x.fillStyle="#0d0a0c"; x.strokeStyle=col; x.lineWidth=ic?2:1.2;
    x.beginPath();x.arc(p.x,p.y,r,0,Math.PI*2);x.fill();x.stroke();
    const key=["core","gid","logi","exchange","buffer","match","flow","dispatch","attention","levers","lexicon"].includes(id);
    if(ic||key||deg>=8){
      x.fillStyle=col; x.font=(ic?"bold 11px":"9px")+" Courier New";
      x.textAlign="center"; x.textBaseline="middle";
      x.fillText(ic?"CORE":id,p.x,p.y+(ic?0:r+9));
    }
  });
}

/* УНИВЕРСАЛЬНЫЙ SNAPSHOT */
function renderSnap(el,t){
  const o=S.get(t);
  if(!o||!o.snap){el.innerHTML=hdr(t.toUpperCase(),"")+`<div class="pn">· узел не зарегистрирован</div>`;return}
  const s=o.snap();
  const nb=G.edges.filter(([a,b])=>a===t||b===t).map(([a,b,w])=>({n:a===t?b:a,w})).sort((x,y)=>y.w-x.w);
  el.innerHTML=hdr(t.toUpperCase(),`[${G.group(t)} · deg=${G.degree(t)}]`)+
    `<div class="c2"><div class="pn"><h2>· SNAPSHOT</h2>${
      Object.entries(s).map(([k,v])=>`<div class="r"><span class="k">${k}</span><span>${typeof v==="object"?JSON.stringify(v):v}</span></div>`).join("")
    }</div>
    <div class="pn"><h2>· СВЯЗИ (${nb.length})</h2>${
      nb.slice(0,20).map(x=>`<div class="r"><span class="k">${x.n}</span><span>${x.w.toFixed(2)}</span></div>`).join("")
    }</div></div>`;
}
