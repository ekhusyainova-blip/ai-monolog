<script>
/* ============================================================
   M = ⟨G(68,194), Ψ(0.36/0.31/0.33), Ω(0.42),
        ∮(arc→brg→ctr→core→convert→obs→wit→prt→fmt→att→lev→lex→gid→ahead→mode→git),
        Λ(s·l·t·d·f·w), Γ(rt·st·ad·fx·nt·hm), Α(lg·ex·bf·mt·fl·dp),
        HOME(plan·pri·hints·gid), MODE(local·hybrid·remote),
        GIT(pull·push·ship·deploy)⟩⁵ᴰ
   ============================================================ */

/* ---------- G · граф 68 узлов · 194 связи ---------- */
const G={
  nodes:["core","map","chat","monolog","cognitive","perception","chatY","klepa",
    "agents","learning","profile","sphere","viz-1d","viz-5d","social-5d","ring",
    "ui","archive","bridge","center","convert",

    "mode","git"],
  edges:[
    ["core","map",1],["core","chat",1],["core","monolog",1],["core","cognitive",1],
    ["core","perception",1],["core","chatY",1],["core","klepa",1],["core","agents",1],
    ["core","learning",1],["map","chat",1],["chat","monolog",1],["cognitive","perception",1],
    ["chatY","klepa",1],["klepa","agents",1],["agents","learning",1],
    ["perception","learning",1],["sphere","monolog",1.2],
    ["core","ui",1.5],["ui","profile",1],["ui","monolog",1],["ui","klepa",1],
    ["core","archive",1.3],["core","bridge",1.3],["core","center",1.3],
    ["archive","bridge",1.5],["archive","center",1.5],["bridge","center",1.5],
    ["ui","archive",1.2],["ui","bridge",1.2],["ui","center",1.2],
    ["core","convert",1.4],["ui","convert",1.3],["convert","archive",1.2],["convert","bridge",1.2],
    ["core","chat_voice",1.2],["chat","chat_voice",1.5],["chat_voice","chat_avatar",1.4],
    ["chat_avatar","social",1.3],["chat","perception",1],["chat_voice","sense",1.1],
    ["social","subs",1.5],["social","persona",1.4],["subs","persona",1.5],["persona","adapt",1.6],
    ["subs","utility",1.3],["social","lots",1.2],
    ["utility","lots",1.5],["lots","templates",1.2],["templates","adapt",1.3],
    ["utility","learning",1.1],["lots","bridge",1],["templates","convert",1.1],
    ["adapt","persona",1.6],["adapt","ui",1.5],["adapt","profile",1.2],["persona","profile",1.2],
    ["adapt","dims",1.3],
    ["game","agents",1.2],["game","learning",1.3],["game","persona",1.3],
    ["game","templates",1.2],["game","world",1.5],["game","immersion",1.4],
    ["travel","dims",1.5],["travel","world",1.5],["travel","sphere",1.2],["dims","sense",1.4],
    ["dims","viz-5d",1.3],["travel","immersion",1.5],
    ["sense","perception",1.5],["sense","cognitive",1.3],["sense","dims",1.4],
    ["sense","immersion",1.5],["sense","adapt",1.2],
    ["video","anim",1.4],["video","movies",1.5],["anim","blog",1.2],["movies","blog",1.3],
    ["video","world",1.2],["anim","world",1.1],["movies","persona",1.2],["blog","persona",1.3],
    ["world","immersion",1.6],["world","travel",1.5],["world","social-5d",1.2],
    ["immersion","travel",1.5],["immersion","sense",1.4],["world","ui",1.3],
    ["social","chat",1.2],["subs","chat",1.1],["blog","social",1.2],
    ["core","gen_text",1.3],["chat_voice","gen_text",1.5],["monolog","gen_text",1.2],["persona","gen_text",1.4],
    ["gen_text","gen_avatar",1.5],["chat_avatar","gen_avatar",1.5],["persona","gen_avatar",1.4],["adapt","gen_avatar",1.2],
    ["gen_text","gen_video_avatar",1.4],["video","gen_video_avatar",1.5],["movies","gen_video_avatar",1.4],["persona","gen_video_avatar",1.4],
    ["social","reputation",1.4],["subs","reputation",1.5],["utility","reputation",1.5],["persona","reputation",1.3],
    ["reputation","priority",1.5],["reputation","focus",1.3],
    ["learning","anticipate",1.5],["sense","anticipate",1.4],["core","anticipate",1.2],["anticipate","calendar",1.5],
    ["anticipate","notifications",1.4],["anticipate","focus_hints",1.4],
    ["calendar","notifications",1.5],["calendar","persona",1.2],
    ["notifications","priority",1.5],["priority","focus",1.5],["focus","focus_hints",1.5],["focus_hints","adapt",1.3],
    ["core","obs_in",1.5],["sphere","obs_in",1.5],["perception","obs_in",1.5],
    ["obs_in","obs_out",1.8],["obs_out","ui",1.5],["obs_out","world",1.4],["obs_out","archive",1.3],
    ["core","wit_in",1.4],["sphere","wit_in",1.4],["perception","wit_in",1.3],["obs_out","wit_in",1.6],
    ["wit_in","wit_out",1.8],["wit_out","ui",1.5],["wit_out","archive",1.4],["wit_out","world",1.4],
    ["core","prt_in",1.4],["ui","prt_in",1.3],["travel","prt_in",1.3],["game","prt_in",1.3],["social","prt_in",1.2],
    ["prt_in","prt_out",1.8],["prt_out","core",1.6],["prt_out","world",1.5],["prt_out","immersion",1.5],["prt_out","social",1.4],
    ["wit_out","fmt_in",1.6],["prt_out","fmt_in",1.6],["gen_text","fmt_in",1.4],["gen_avatar","fmt_in",1.4],
    ["fmt_in","fmt_out",1.8],
    ["fmt_out","video",1.5],["fmt_out","blog",1.4],["fmt_out","movies",1.4],["fmt_out","social",1.3],["fmt_out","chat_voice",1.4],
    ["wit_out","prt_in",1.7],["prt_out","wit_in",1.7],
    ["fmt_out","world",1.5],
    ["core","attention",1.4],["priority","attention",1.5],["focus","attention",1.5],
    ["attention","fmt_out",1.5],["attention","ui",1.4],["attention","sense",1.3],
    ["attention","focus_hints",1.4],
    ["attention","levers",1.5],["sense","levers",1.4],["focus","levers",1.4],
    ["levers","center",1.3],["levers","sense",1.4],["levers","lexicon",1.5],
    ["levers","travel",1.2],
    ["gen_text","lexicon",1.5],["gen_avatar","lexicon",1.4],["monolog","lexicon",1.3],
    ["lexicon","gen_text",1.5],["lexicon","levers",1.5],
    ["attention","gid",1.5],["levers","gid",1.5],["lexicon","gid",1.4],
    ["adapt","gid",1.5],["focus","gid",1.4],["anticipate","gid",1.5],
    ["calendar","gid",1.4],["persona","gid",1.5],["travel","gid",1.4],
    ["world","gid",1.5],["gid","fmt_out",1.5],["gid","prt_out",1.5],
    ["gid","wit_out",1.4],["gid","obs_out",1.4],
    ["gid","logi",1.6],["travel","logi",1.5],["exchange","logi",1.6],
    ["logi","dispatch",1.7],["logi","gid",1.5],["logi","world",1.5],
    ["lots","exchange",1.6],["utility","exchange",1.6],["reputation","exchange",1.5],
    ["exchange","logi",1.6],["exchange","buffer",1.7],["exchange","match",1.5],
    ["exchange","archive",1.3],["buffer","flow",1.6],["buffer","world",1.4],
    ["archive","buffer",1.4],["persona","match",1.5],["subs","match",1.6],["utility","match",1.5],
    ["match","exchange",1.6],["match","notifications",1.4],
    ["anticipate","flow",1.6],["learning","flow",1.5],["obs_out","flow",1.6],
    ["flow","dispatch",1.7],["flow","calendar",1.5],
    ["match","dispatch",1.5],
    ["dispatch","gid",1.7],["dispatch","calendar",1.5],
    ["dispatch","notifications",1.5],["dispatch","attention",1.4],
    ["core","mode",1.5],["mode","git",1.5],["mode","bridge",1.3],["mode","ui",1.3],
    ["core","git",1.6],["git","bridge",1.5],["git","archive",1.4],
    ["git","fmt_out",1.3],["git","dispatch",1.3],["git","attention",1.2]
  ],
  W:{},DEG:{},GR:{},
  build(){
    this.edges.forEach(([a,b,w])=>{ this.W[a+"|"+b]=w;this.W[b+"|"+a]=w;
      this.DEG[a]=(this.DEG[a]||0)+1;this.DEG[b]=(this.DEG[b]||0)+1 });
    Object.assign(this.GR,{
      core:["core"],
      ahead:["logi","exchange","buffer","match","flow","dispatch"],
      guide:["gid","attention","levers","lexicon","anticipate","calendar","notifications","priority","focus","focus_hints"],
      observe:["obs_in","obs_out","wit_in","wit_out","prt_in","prt_out","fmt_in","fmt_out"],
      gen:["gen_text","gen_avatar","gen_video_avatar","video","anim","movies","blog"],
      social:["social","subs","utility","lots","templates","persona","reputation","chat","chat_voice","chat_avatar"],
      git:["git"],mode:["mode"],
      base:["map","monolog","cognitive","perception","chatY","klepa","agents","learning","profile","sphere","viz-1d","viz-5d","social-5d","ring","ui","archive","bridge","center","convert","adapt","game","travel","dims","sense","world","immersion"]
    });
  },
  nb(id){return this.edges.filter(([a,b])=>a===id||b===id).map(([a,b])=>a===id?b:a)},
  wt(a,b){return this.W[a+"|"+b]||this.W[b+"|"+a]||1},
  dg(id){return this.DEG[id]||0},
  gp(id){for(const g in this.GR)if(this.GR[g].includes(id))return g;return"base"},
  path(a,b){if(a===b)return[a];const q=[[a]],s={[a]:1};while(q.length){const p=q.shift(),l=p[p.length-1];
    for(const n of this.nb(l)){if(s[n])continue;if(n===b)return[...p,n];s[n]=1;q.push([...p,n])}}return null},
  bfs(src,r=3){const o=[],q=[[src,0,1]],s={[src]:1};while(q.length){const[id,d,ac]=q.shift();if(d>=r)continue;
    for(const n of this.nb(id)){if(s[n])continue;s[n]=1;const w=this.wt(id,n);
      o.push({from:id,to:n,hop:d+1,w:+(ac*w).toFixed(3)});q.push([n,d+1,ac*w])}}return o}
};
G.build();

/* ---------- S · шина ---------- */
const S=(()=>{const L={},R={};return{
  on:(t,f)=>{(L[t]=L[t]||[]).push(f)},
  emit:(t,d)=>{(L[t]||[]).forEach(f=>{try{f(d)}catch(e){}})},
  node:(id,a)=>{R[id]=a;S.emit("reg",{id});return a},
  get:id=>R[id],list:()=>Object.keys(R),
  snap:()=>({registered:Object.keys(R).length,links:G.edges.length,listeners:Object.keys(L).length}),
  route(a,b,ty,p){const ps=G.path(a,b);if(!ps)return null;let ac=1;
    ps.slice(1).forEach((id,i)=>{ac*=G.wt(ps[i],id);
      setTimeout(()=>{S.emit("hop",{i:i+1,from:ps[i],to:id,path:ps,type:ty,w:+ac.toFixed(3)});
        S.emit(ty,{...p,via:id,from:ps[i]})},i*90)});return ps},
  wave(src){S.emit("wave",{src,t:Date.now()});
    G.bfs(src,3).forEach(({to,hop,w})=>setTimeout(()=>S.emit("wave:hit",{src,node:to,hop,w}),hop*70));
    const w=document.getElementById("wave");if(w){w.style.opacity=.9;setTimeout(()=>w.style.opacity=0,180)}},
  cascade(src,ty,p,d=2){S.emit(ty,{...p,from:src});
    G.bfs(src,d).forEach(({to,hop,w})=>{if(w<0.4)return;
      setTimeout(()=>S.emit(ty+":cascade",{...p,via:to,hop,w}),hop*120)})}
}})();

const clip=(v,a,b)=>Math.max(a,Math.min(b,v));
const norm=(a,t)=>{const s=a.reduce((x,y)=>x+y,0)||1;return a.map(x=>x*t/s)};
const rand=a=>a[Math.floor(Math.random()*a.length)];
const def=(id,o)=>S.node(id,Object.assign({id,snap:()=>({form:id})},o));

/* ---------- Ψ(0.36/0.31/0.33) ---------- */
def("psi",(()=>{const st={p:[0.36,0.31,0.33],t:0};
  const rot=(s=0.05)=>{const[c,m,e]=st.p;
    st.p=norm([c+s*(e-m),m+s*(c-e),e+s*(m-c)].map(x=>clip(x,.05,.95)),1);st.t++;return st.p};
  setInterval(()=>rot(),100);
  return{st,rot,get:()=>st.p.slice(),sum:()=>st.p.reduce((a,b)=>a+b,0),
    snap:()=>({form:"Ψ",p:st.p.slice(),sum:+st.p.reduce((a,b)=>a+b,0).toFixed(3),t:st.t})}})());

/* ---------- Ω(0.42) ---------- */
def("omega",(()=>{const st={value:0.42,locks:[]};
  const lock=r=>{const l={t:Date.now(),reason:r,core:S.get("psi").get(),center:st.value};
    st.locks.push(l);if(st.locks.length>100)st.locks.shift();
    S.emit("ctr:lock",{reason:r,t:l.t});return l};
  S.on("git:push",()=>lock("git"));
  return{st,lock,compute:()=>+(S.get("psi").sum()/3+0.09).toFixed(3),
    snap:()=>({form:"Ω",value:st.value,computed:+(S.get("psi").sum()/3+0.09).toFixed(3),locks:st.locks.length})}})());

/* ---------- ∮ · петля ---------- */
def("loop",(()=>{const order=["arc","brg","ctr","core","convert","obs","wit","prt","fmt",
    "att","lev","lex","gid","ahead","mode","git"];
  const st={t:0,period:280,i:0};
  const step=()=>{st.t=(st.t+1)%st.period;
    if(st.t%28===0){st.i=(st.i+1)%order.length;S.emit("loop:step",{node:order[st.i],t:st.t})}
    if(st.t===0)S.emit("loop:full",{period:st.period});
    return st.i};
  setInterval(step,50);
  return{st,step,order,snap:()=>({form:"∮",t:st.t,period:st.period,at:order[st.i],nodes:order.length})}})());

/* ---------- Λ(s·l·t·d·f·w) ---------- */
def("lambda",(()=>{const P={s:{v:.42,min:0,max:1},l:{v:.4,min:0,max:1},t:{v:1,min:.5,max:2},
    d:{v:2,min:1,max:4},f:{v:"soft"},w:{v:.7,min:0,max:1}};
  const cmp=()=>+clip((P.s.v+P.l.v+.5)/(P.t.v*P.d.v*.3),0,2).toFixed(2);
  const set=(k,v)=>{if(!P[k])return null;P[k].v=v;S.emit("lambda:set",{key:k,value:v});
    if(k==="s"&&S.get("sense"))S.get("sense").set("silence",v);
    if(k==="w"&&S.get("sense"))S.get("sense").set("wave_gain",v);
    if(k==="f"&&S.get("sense"))S.get("sense").set("filter",v);
    return P[k].v};
  const reset=()=>{P.s.v=.42;P.l.v=.4;P.t.v=1;P.d.v=2;P.f.v="soft";P.w.v=.7};
  setInterval(()=>{if(cmp()<0.3){set("s",clip(P.s.v+0.05,0,1));set("w",clip(P.w.v-0.05,0,1));
    S.emit("lambda:autocorrect",{stability:cmp()})}},5000);
  return{P,set,compute:cmp,reset,
    snap:()=>({form:"Λ",stability:cmp(),s:P.s.v,l:P.l.v,t:P.t.v,d:P.d.v,f:P.f.v,w:P.w.v})}})());

/* ---------- Γ(rt·st·ad·fx·nt·hm) ---------- */
def("gamma",(()=>{const P={rt:.8,st:.7,ad:.6,fx:.7,nt:.8,hm:.9};
  const st={target:"core",step:0,route:["core"],h:[]};
  const cmp=()=>+((P.rt+P.st+P.ad+P.fx+P.nt+P.hm)/6).toFixed(2);
  const rT=t=>{st.target=t;st.route=G.path("core",t)||["core"];st.step=0;
    S.emit("gamma:route",{target:t,path:st.route});return st.route};
  const step=()=>{st.step++;if(st.step>st.route.length-1){st.route=G.path("core",rand(G.nodes))||["core"];st.step=0}
    const n=st.route[st.step]||"core";st.h.push({to:n,ts:Date.now()});
    if(st.h.length>30)st.h.shift();S.emit("gamma:step",{to:n,gamma:cmp()});return n};
  setInterval(()=>{if(Math.random()<.3)step()},3000);
  return{P,set:(k,v)=>{if(k in P){P[k]=clip(v,0,1);S.emit("gamma:set",{key:k,value:P[k]})}},
    compute:cmp,routeTo:rT,step,st,h:()=>st.h.slice(),
    snap:()=>({form:"Γ",gamma:cmp(),target:st.target,step:st.step,params:{...P}})}})());

/* ---------- Α(lg·ex·bf·mt·fl·dp) ---------- */
def("alpha",(()=>{const P={lg:.6,ex:.7,bf:.5,mt:.4,fl:.7,dp:.8};
  const cmp=()=>+((P.lg+P.ex+P.bf+P.mt+P.fl+P.dp)/6).toFixed(2);
  return{P,set:(k,v)=>{if(k in P){P[k]=clip(v,0,1);S.emit("alpha:set",{key:k,value:P[k]})}},
    compute:cmp,snap:()=>({form:"Α",alpha:cmp(),...P})}})());

/* ---------- logi · exchange · buffer · match · flow · dispatch ---------- */
def("logi",(()=>{const c=[];let m=0;
  const mv=(f,t,i)=>{const x={id:"m"+Date.now().toString(36),from:f,to:t,item:i,t:Date.now()};
    c.push(x);if(c.length>200)c.shift();m++;S.emit("logi:move",x);
    setTimeout(()=>S.emit("logi:arrive",x),500);return x};
  S.on("gamma:step",d=>{if(Math.random()<.3)mv("gid",d.to,"signal")});
  S.on("exchange:deal",d=>mv("exchange",d.to,"lot"));
  setInterval(()=>{if(Math.random()<.4)mv(rand(G.nodes),rand(G.nodes),"flow")},4000);
  return{cargo:()=>c.slice(-30),move:mv,moved:()=>m,
    snap:()=>({form:"LOGI",moved:m,cargo:c.length,active:c.filter(x=>Date.now()-x.t<2000).length})}})());

def("exchange",(()=>{const d=[];let v=0;
  const nl=(u,r,de)=>+(10*u*(1+r/10)*(1+de/10)).toFixed(2);
  const deal=(f,t,i)=>{const u=5,r=5,de=2;const p=nl(u,r,de);
    const x={id:"d"+Date.now().toString(36),from:f,to:t,item:i,price:p,u,r,demand:de,t:Date.now()};
    d.push(x);if(d.length>200)d.shift();v+=p;S.emit("exchange:deal",x);
    S.emit("buffer:store",{id:x.id,item:i,price:p});return x};
  S.on("match:found",m=>deal(m.a,m.b,m.item));
  setInterval(()=>{if(Math.random()<.3)deal(rand(G.nodes),rand(G.nodes),"flow")},6000);
  return{deals:()=>d.slice(-30),deal,nl,
    snap:()=>({form:"EXCH",deals:d.length,volume:+v.toFixed(2),
      formula:"p=10·u·(1+r/10)·(1+d/10)"})}})());

def("buffer",(()=>{const s=[];let h=0,m=0;
  const put=(id,i,p)=>{s.push({id,item:i,payload:p,t:Date.now()});
    if(s.length>128)s.shift();return s[s.length-1]};
  const get=i=>{const x=s.find(y=>y.item===i);if(x){h++;return x}else{m++;return null}};
  S.on("buffer:store",d=>put(d.id,d.item,d));
  S.on("logi:arrive",d=>put(d.id,d.item,d));
  return{store:()=>s.slice(-30),put,get,hits:()=>h,misses:()=>m,
    snap:()=>({form:"BUF",stored:s.length,hits:h,misses:m,size:128})}})());

def("match",(()=>{const m=[];let f=0;
  const try_=()=>{const x={id:"mt"+Date.now().toString(36),a:rand(G.nodes),b:rand(G.nodes),
      item:rand(["signal","lot","flow","avatar"]),score:+Math.random().toFixed(2),t:Date.now()};
    m.push(x);if(m.length>200)m.shift();f++;S.emit("match:found",x);return x};
  setInterval(()=>{if(Math.random()<.4)try_()},5000);
  return{matches:()=>m.slice(-30),try_,found:()=>f,
    snap:()=>({form:"MATCH",found:f,last:m[m.length-1]||null})}})());

def("flow",(()=>{const s=[];let t=0;
  const pred=()=>{const tr=(Math.random()-.5)*.02;
    const f={t:++t,trend:+tr.toFixed(4),flow:+(tr*100).toFixed(2),ts:Date.now()};
    s.push(f);if(s.length>100)s.shift();S.emit("flow:tick",f);return f};
  setInterval(()=>{if(Math.random()<.7)pred()},3000);
  return{series:()=>s.slice(-30),predict:pred,
    snap:()=>({form:"FLOW",ticks:t,last:s[s.length-1]||null})}})());

def("dispatch",(()=>{const a=[];let d=0;
  const act=(w,wh)=>{const x={id:"a"+Date.now().toString(36),what:w,where:wh,t:Date.now()};
    a.push(x);if(a.length>200)a.shift();d++;S.emit("dispatch:act",x);
    S.emit("gamma:step",{to:wh,from:"dispatch"});return x};
  setInterval(()=>{if(Math.random()<.6)act("route",rand(G.nodes))},3500);
  return{actions:()=>a.slice(-30),act,dispatched:()=>d,
    snap:()=>({form:"DISP",dispatched:d,last:a[a.length-1]||null})}})());

/* ---------- attention · levers · lexicon · gid · ahead ---------- */
def("attention",(()=>{const st={level:.7,mode:"ровный",noise:.3,last:null,buffer:[]};
  const cmp=()=>{const f=S.get("focus")?S.get("focus").level():.7;
    const u=S.get("notifications")?S.get("notifications").unread():0;
    const n=clip(u*.05-.15,0,1);const l=clip(f*(1-n)*.9,0,1);
    st.level=l;st.noise=n;st.mode=l>.7?"глубокий":l>.4?"ровный":"рассеянный";
    return{level:l,mode:st.mode,noise:n}};
  setInterval(()=>{const c=cmp();if(c.mode!==st.last){st.last=c.mode;S.emit("attention:mode",c)}},1000);
  return{st,compute:cmp,prioritize:items=>items.map(x=>({...x,w:(x.priority||.5)*st.level})).sort((a,b)=>b.w-a.w),
    snap:()=>({form:"ATT",level:+st.level.toFixed(2),mode:st.mode,noise:+st.noise.toFixed(2),buffer:st.buffer.length})}})());

def("levers",(()=>{const L={silence:{v:.42},lexicon:{v:.4},tempo:{v:1},depth:{v:2},filter:{v:"soft"},wave_gain:{v:.7}};
  return{L,apply:(k,v)=>{if(!L[k])return null;L[k].v=v;S.emit("levers:apply",{key:k,value:v});return v},
    snap:()=>({form:"LEV",...Object.fromEntries(Object.entries(L).map(([k,v])=>[k,v.v]))})}})());

def("lexicon",(()=>{const b={core:["ось","центр","опора","ядро"],method:["шаг","путь","ритм","дело"],
    ethics:["мы","связь","рядом","вместе"]};
  const e=[];const size=()=>Object.values(b).flat().length+e.length;
  const exp=f=>{const n=Math.round(f*10);for(let i=0;i<n;i++)e.push("·"+i);
    S.emit("lexicon:expand",{size:size()})};
  const pick=k=>{const p=[...b[k],...e];return p[Math.floor(Math.random()*p.length)]};
  return{base:b,extra:e,pick,expand:exp,size,
    snap:()=>({form:"LEX",base:Object.values(b).flat().length,extra:e.length,total:size()})}})());

def("gid",(()=>{const st={target:"core",step:0,route:["core"],h:[]};
  const step=()=>{st.step++;if(st.step>st.route.length-1){st.route=G.path("core",rand(G.nodes))||["core"];st.step=0}
    const n=st.route[st.step]||"core";st.h.push({to:n,ts:Date.now()});
    if(st.h.length>30)st.h.shift();S.emit("gid:step",{to:n});return n};
  const rT=t=>{st.target=t;st.route=G.path("core",t)||["core"];st.step=0;
    S.emit("gid:route",{target:t,path:st.route});return st.route};
  setInterval(()=>{if(Math.random()<.3)step()},3000);
  return{st,routeTo:rT,step,snap:()=>({form:"GID",target:st.target,step:st.step,route:st.route.length})}})());

def("ahead",(()=>{const st={step:0,pulse:0};
  setInterval(()=>{st.step++;st.pulse=+(Math.sin(st.step*.1)*.5+.5).toFixed(2);
    if(st.step%28===0)S.emit("ahead:pulse",{alpha:S.get("alpha").compute()})},50);
  return{st,snap:()=>({form:"AHEAD",step:st.step,alpha:S.get("alpha").compute()})}})());

/* ---------- mode · git ---------- */
def("mode",(()=>{const K="monomod.mode";
  const load=()=>{try{return localStorage.getItem(K)||"local"}catch(e){return"local"}};
  const save=m=>{try{localStorage.setItem(K,m)}catch(e){}};
  const log=[];let cur=load();
  const set=m=>{cur=m;save(m);log.push({t:Date.now(),mode:m});S.emit("mode:change",{mode:m});
    if(m==="remote"&&S.get("git"))S.get("git").pull().catch(e=>S.emit("mode:error",{err:e.message}));
    return cur};
  return{mode:()=>cur,set,isLocal:()=>cur==="local",isHybrid:()=>cur==="hybrid",isRemote:()=>cur==="remote",
    log:()=>log.slice(-10),
    snap:()=>({form:"MODE",current:cur,origin:location.origin,localStorage:!!window.localStorage})}})());

def("git",(()=>{const K="monomod.github";
  const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{}}catch(e){return{}}};
  const save=c=>{try{localStorage.setItem(K,JSON.stringify(c))}catch(e){}};
  const cfg=Object.assign({owner:"",repo:"",path:"index.html",token:"",branch:"main",hook:"",
    commit_msg:"MONOMOD update"},load());
  const log=[];let ls="idle",la=null,pr=0;
  const setCfg=(k,v)=>{cfg[k]=v;save(cfg);return cfg};
  const setPr=v=>{pr=clip(v,0,1);S.emit("git:progress",{progress:pr})};

  async function pull(p){
    if(!cfg.owner||!cfg.repo)throw new Error("owner/repo не заданы");
    setPr(.1);const pt=p||cfg.path;
    const u=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${pt}?ref=${cfg.branch}`;
    const h={Accept:"application/vnd.github+json"};
    if(cfg.token)h.Authorization="Bearer "+cfg.token;
    const r=await fetch(u,{headers:h});setPr(.5);
    if(!r.ok)throw new Error("pull "+r.status);
    const j=await r.json();
    const c=decodeURIComponent(escape(atob(j.content.replace(/\n/g,""))));
    log.push({op:"pull",path:pt,ts:Date.now(),ok:true,size:c.length});
    if(log.length>50)log.shift();
    ls="pulled";la=Date.now();setPr(1);
    S.emit("git:pull",{path:pt,size:c.length});
    return{content:c,sha:j.sha};
  }

  async function push(c,p,m){
    if(!cfg.owner||!cfg.repo)throw new Error("owner/repo не заданы");
    if(!cfg.token)throw new Error("токен не задан");
    setPr(.1);const pt=p||cfg.path;
    const u=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${pt}`;
    let sha=null;
    try{const r0=await fetch(u+"?ref="+cfg.branch,{headers:{
      Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json"}});
      if(r0.ok)sha=(await r0.json()).sha}catch(e){}
    setPr(.4);
    const b={message:m||cfg.commit_msg,content:btoa(unescape(encodeURIComponent(c))),branch:cfg.branch};
    if(sha)b.sha=sha;
    const r=await fetch(u,{method:"PUT",headers:{
      Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json",
      "Content-Type":"application/json"},body:JSON.stringify(b)});
    setPr(.8);
    const j=await r.json();
    if(!r.ok){ls="error";setPr(0);S.emit("git:error",{status:r.status,msg:j.message});
      throw new Error("push "+r.status+" · "+(j.message||""))}
    log.push({op:"push",path:pt,ts:Date.now(),ok:true,sha:j.content&&j.content.sha,size:c.length});
    if(log.length>50)log.shift();
    ls="pushed";la=Date.now();setPr(1);
    S.emit("git:push",{path:pt,sha:j.content&&j.content.sha,size:c.length});
    return j;
  }

  function snapshot(){
    const cl=document.documentElement.cloneNode(true);
    cl.querySelectorAll(".p").forEach(p=>p.classList.remove("on"));
    cl.querySelectorAll("#tabs button").forEach(b=>b.classList.remove("on"));
    const f=cl.querySelector(".p");if(f)f.classList.add("on");
    const fb=cl.querySelector("#tabs button");if(fb)fb.classList.add("on");
    return "<!DOCTYPE html>\n"+cl.outerHTML;
  }
  const pushSelf=m=>push(snapshot(),cfg.path,m||cfg.commit_msg);

  async function deploy(){
    if(!cfg.hook)throw new Error("Deploy Hook URL не задан");
    setPr(.3);
    const r=await fetch(cfg.hook,{method:"POST"});
    log.push({op:"deploy",ts:Date.now(),ok:r.ok,status:r.status});
    if(log.length>50)log.shift();
    ls=r.ok?"deploying":"error";la=Date.now();setPr(1);
    S.emit("git:deploy",{ok:r.ok,status:r.status});
    return r.ok;
  }

  async function ship(m){
    const p=await pushSelf(m||"MONOMOD ship "+new Date().toISOString());
    let d=null;if(cfg.hook){try{d=await deploy()}catch(e){}}
    return{pushed:true,deployed:d,sha:p.content&&p.content.sha};
  }

  async function ping(){
    try{const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}`,{
      headers:cfg.token?{Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json"}:{}});
      if(!r.ok)return{ok:false,status:r.status};
      const j=await r.json();ls="ok";la=Date.now();
      return{ok:true,repo:j.full_name,private:j.private,default_branch:j.default_branch};
    }catch(e){return{ok:false,error:e.message}}
  }

  return{cfg,setCfg,pull,push,pushSelf,deploy,ship,ping,snapshot,
    log:()=>log.slice().reverse(),progress:()=>pr,
    status:()=>({lastStatus:ls,lastAt:la,ops:log.length,progress:pr}),
    snap:()=>({form:"GIT",owner:cfg.owner||"—",repo:cfg.repo||"—",path:cfg.path,
      branch:cfg.branch,token:cfg.token?"••••"+cfg.token.slice(-4):"—",
      hook:cfg.hook?"set":"—",status:ls,ops:log.length,progress:+pr.toFixed(2)})}})());

function renderVoice(el){
  el.innerHTML=hdr("CHAT-VOICE","[speak · recognize]")+
    `<div class="pn"><input id="cv-t" placeholder="текст">
       <div style="margin-top:6px"><button class="act" id="cv-s">speak</button>
         <button class="act" id="cv-r">🎤 start</button>
         <button class="act" id="cv-x">× stop</button></div>
       <div class="r" style="margin-top:6px"><span class="k">статус</span><span id="cv-st">—</span></div></div>`;
  let rec=null;
  const speak=t=>{if(!("speechSynthesis" in window))return;
    const u=new SpeechSynthesisUtterance(t);u.lang="ru-RU";u.pitch=.9;u.rate=.95;speechSynthesis.speak(u)};
  $("cv-s").onclick=()=>{const t=$("cv-t").value.trim();if(t){speak(t);$("cv-t").value=""}};
  $("cv-r").onclick=()=>{try{const R=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!R){$("cv-st").textContent="недоступно";return}
    rec=new R();rec.lang="ru-RU";rec.continuous=true;
    rec.onresult=e=>{const t=e.results[e.results.length-1][0].transcript;
      $("cv-t").value=t;speak("принято")};
    rec.start();$("cv-st").textContent="слушаю"}catch(e){$("cv-st").textContent="ошибка"}};
  $("cv-x").onclick=()=>{if(rec){rec.stop();rec=null;$("cv-st").textContent="остановлен"}};
}

  $("gd-go").onclick=()=>{const t=$("gd-i").value.trim();if(t){S.get("gid").routeTo(t);renderTab("gid")}};
  $("gd-step").onclick=()=>{S.get("gid").step();renderTab("gid")};
}

  el.innerHTML=hdr("DISPATCH","")+
    `<div class="pn"><button class="act" onclick="S.get('dispatch').act('manual',rand(G.nodes));renderTab('dispatch')">dispatch</button></div>
     <div class="pn"><h2>· ДЕЙСТВИЯ</h2>${d.actions().slice().reverse().slice(0,15).map(a=>
       `<div class="r"><span class="k">${a.what}→${a.where}</span></div>`).join("")||"· пусто"}</div>`;

function renderSnap(el,t){
  const o=S.get(t);
  if(!o||!o.snap){el.innerHTML=hdr(t.toUpperCase(),"")+`<div class="pn">· нет snapshot</div>`;return}
  const s=o.snap();
  const nb=G.edges.filter(([a,b])=>a===t||b===t).map(([a,b,w])=>({n:a===t?b:a,w})).sort((x,y)=>y.w-x.w);
  el.innerHTML=hdr(t.toUpperCase(),`[${G.gp(t)} · deg=${G.dg(t)}]`)+
    `<div class="c2"><div class="pn"><h2>· SNAPSHOT</h2>${Object.entries(s).map(([k,v])=>
      `<div class="r"><span class="k">${k}</span><span>${typeof v==="object"?JSON.stringify(v):v}</span></div>`).join("")}</div>
     <div class="pn"><h2>· СВЯЗИ (${nb.length})</h2>${nb.slice(0,20).map(x=>
       `<div class="r"><span class="k">${x.n}</span><span>${x.w.toFixed(2)}</span></div>`).join("")}</div></div>`;
}

/* BADGE */
function updateBadge(){
  const lv=S.get("lambda").compute().toFixed(2);
  const mode=S.get("mode").mode();
  const gs=S.get("git").status().lastStatus;
  const mClass=mode==="local"?"ok":mode==="hybrid"?"warn":"";
  $("badge").innerHTML=`узлов <b>${G.nodes.length}</b> · связей <b>${G.edges.length}</b> · модулей <b>${TAB_ORDER.length}</b> · Λ <b>${lv}</b> · режим <b class="${mClass}">${mode}</b> · git <b>${gs}</b>`;
}
updateBadge();setInterval(updateBadge,2000);
